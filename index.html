<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟股票交易小游戏</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", Arial, sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh;
         margin:0; background:#f5f6fa; color:#1a1d24; }
  .wrap { text-align:center; padding:40px; }
  .spinner { width:40px; height:40px; border:3px solid #e4e6ef; border-top-color:#3a4fef;
              border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size:20px; font-weight:700; margin-bottom:8px; }
  .tip { font-size:13px; color:#9aa0b0; }
  a { color:#3a4fef; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>
  <div class="title">正在为你打开游戏…</div>
  <div class="tip" id="uaTip"></div>
</div>
<script>
(function(){
  var ua = navigator.userAgent || '';
  var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile/i.test(ua);
  var target = isMobile ? 'stock_game_v4_mobile.html' : 'stock_game_v4.html';
  document.getElementById('uaTip').textContent = isMobile ? '检测到移动端，跳转手机版' : '检测到桌面端，跳转PC版';
  // 300ms 延迟让 spinner 可见，也让浏览器有时间完成渲染
  setTimeout(function(){ location.replace(target); }, 300);
})();
</script>
</body>
</html>
