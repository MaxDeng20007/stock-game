}
function saveNick(){
  const nick = document.getElementById('nickInput').value.trim().slice(0, 12);
  const s = loadSettings();
  s.nick = nick;
  saveSettings(s);
  refreshAvatar();
  showCenterMain();
  showTip(nick ? ('昵称已保存：' + nick) : '昵称已清空');
}
function setLoginTab(tab){
  document.getElementById('modeGuest').classList.toggle('active', tab === 'guest');
  document.getElementById('modeLogin').classList.toggle('active', tab === 'login');
  document.getElementById('guestHint').style.display = tab === 'guest' ? '' : 'none';
  document.getElementById('loginForm').style.display = tab === 'login' ? '' : 'none';
}
function guestEnter(){
  const s = loadSettings();
  s.mode = 'guest'; s.user = ''; s.code = '';
  saveSettings(s);
  refreshAvatar();
  showCenterMain();
}
function sendCode(){
  const user = document.getElementById('loginUser').value.trim();
  if(!user){ showTip('请先输入手机号或邮箱'); return; }
  const isPhone = /^1\d{10}$/.test(user);
  const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(user);
  if(!isPhone && !isEmail){ showTip('手机号或邮箱格式不正确'); return; }
  const code = String(Math.floor(100000 + Math.random() * 900000));
  const s = loadSettings();
  s.code = code;
  saveSettings(s);
  document.getElementById('codeDisplay').textContent = '验证码：' + code;
}
function doLogin(){
  const user = document.getElementById('loginUser').value.trim();
  const code = document.getElementById('loginCode').value.trim();
  if(!user){ showTip('请输入手机号或邮箱'); return; }
  if(!code){ showTip('请输入验证码'); return; }
  const s = loadSettings();
  if(!s.code || code !== s.code){ showTip('验证码不正确，请重新获取'); return; }
  s.mode = 'login'; s.user = user; s.code = '';
  saveSettings(s);
  refreshAvatar();
  showCenterMain();
}
function logout(){
  const s = loadSettings();
  s.mode = ''; s.user = ''; s.code = '';
  saveSettings(s);
  document.getElementById('loginUser').value = '';
  document.getElementById('loginCode').value = '';
  document.getElementById('codeDisplay').textContent = '';
  refreshAvatar();
  showCenterLogin();
}
function renderHistory(){
  const h = loadHistory();
  const box = document.getElementById('histList');
  const all = [].concat(
    h.archived.map(s => ({s: s, arc: true})),
    h.recent.map(s => ({s: s, arc: false}))
  ).sort((a, b) => b.s.ts - a.s.ts);
  if(!all.length){
    box.innerHTML = '<div class="hint" style="padding:10px;">暂无历史记录，完成一局游戏后自动保存</div>';
    return;
  }
  let html = '';
  for(const item of all){
    const s = item.s;
    const name = s.real ? s.real.name : '模拟行情';
    const d = new Date(s.ts);
    const ds = (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    const retCls = s.ret >= 0 ? 'up' : 'down';
    html += '<div style="display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px solid #1a2233;font-size:12px;">'
      + '<span style="flex:1;min-width:0;">'
      + '<b style="color:#e6e9f0;">' + name + '</b>'
      + ' <span class="' + retCls + '">' + (s.ret>=0?'+':'') + s.ret.toFixed(2) + '%</span>'
      + ' <span class="hint">' + ds + (item.arc ? ' · 已存档' : '') + '</span>'
      + '</span>'
      + '<button class="btn" style="padding:3px 10px;font-size:12px;" data-act="rv" data-id="' + s.id + '">复盘</button>'
      + (item.arc
          ? '<button class="btn" style="padding:3px 10px;font-size:12px;" data-act="del" data-id="' + s.id + '">删除</button>'
          : '<button class="btn" style="padding:3px 10px;font-size:12px;" data-act="arc" data-id="' + s.id + '">存档</button>')
      + '</div>';
  }
  box.innerHTML = html;
  box.querySelectorAll('button[data-act]').forEach(b => {
    b.addEventListener('click', ()=>{
      const id = b.dataset.id;
      const snap = findSnap(id);
      if(!snap) return;
      if(b.dataset.act === 'rv'){
        enterReview(snap);   // 复盘后返回回到个人中心（复盘返回关闭复盘弹窗即可）
      }else if(b.dataset.act === 'arc'){
        archiveGame(id);
        renderHistory();
      }else if(b.dataset.act === 'del'){
        deleteGame(id);
        renderHistory();
      }
    });
  });
}
function setCapital(v){
  const cap = parseFloat(v);
  if(!cap || cap < 10000){ showTip('初始资金至少 1 万'); return; }
  const s = loadSettings();
  s.initCash = cap;
  saveSettings(s);
  // 更新按钮选中态
  document.querySelectorAll('#centerMain .btn.pos[data-cap]').forEach(b =>
    b.classList.toggle('active', parseFloat(b.dataset.cap) === cap));
  // 资金变更：后台立即按新资金重新筛选股票（下一局直接使用）
  kickBackgroundPick();
  // 若本局还没开始，直接按新资金重新准备本局（立即生效）
  if(G && !G.started && !G.over){
    closeCenter();
    newGame(false);
  }
  showTip('初始资金已设为 ' + fmt(cap) + '，后台正在重新筛选买得起的股票，下一局生效');
}

/* ===================== UI ===================== */
function fmt(n){ return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* 上一根已完成日K的收盘价（涨跌率基准），开局第一天之前返回 null */
function prevDayClose(){
  const day = Math.floor(G.curTickIdx / CFG.dayTicks);   // 当前 tick 所在交易日序号
  if(day <= 0) return null;
  return G.tickOHLC[(day - 1) * CFG.dayTicks + CFG.dayTicks - 1].c;
}

function updateUI(){
  if(!G || !G.tickOHLC.length) return;   // 行情未就绪时跳过（此时按钮均禁用）
  const p = curPrice();
  // 顶栏放大版价格（不带"当前价"标签）
  document.getElementById('curPrice').textContent = p.toFixed(2);
  // 涨跌率：以日K为基准（相对上一根已完成日K收盘价），涨橙跌青绿
  const chgEl = document.getElementById('dayChg');
  const pc = prevDayClose();
  if(pc){
    const chg = (p - pc) / pc * 100;
    chgEl.textContent = (chg>=0?'+':'') + chg.toFixed(2) + '%';
    chgEl.className = 'chg-big ' + (chg>=0?'up':'down');
  } else {
    chgEl.textContent = '--';
    chgEl.className = 'chg-big';
  }
  // 日K进度 + 操作点状态
  const phaseTag = document.getElementById('phaseTag');
  if(G.started && !G.over){
    document.getElementById('dayProg').textContent = (G.curBar+1) + '/' + CFG.settleDayBars;
    const deal = curPrice();
    if(G.phase === 'open'){
      phaseTag.className = 'phase-tag open';
      phaseTag.textContent = (G.curBar+1) + '/' + CFG.settleDayBars + ' · 开盘 · ' + deal.toFixed(2);
    }else{
      phaseTag.className = 'phase-tag close';
      phaseTag.textContent = (G.curBar+1) + '/' + CFG.settleDayBars + ' · 收盘 · ' + deal.toFixed(2);
    }
  } else if(G.over){
    document.getElementById('dayProg').textContent = CFG.settleDayBars + '/' + CFG.settleDayBars;
    phaseTag.className = 'phase-tag close';
    phaseTag.textContent = '已结算';
  } else {
    document.getElementById('dayProg').textContent = '0/' + CFG.settleDayBars;
    phaseTag.className = 'phase-tag open';
    phaseTag.textContent = '等待开局';
  }
  // 资金
  const fp = floatPnl(p);
  const total = totalAsset(p);
  const ret = (total - G.initCash)/G.initCash*100;
  // hero：收益率
  const heroRet = document.getElementById('heroRet');
  heroRet.textContent = (ret>=0?'+':'') + ret.toFixed(2) + '%';
  heroRet.style.color = ret>=0 ? 'var(--up)' : 'var(--down)';
  // hero：可用资金
  document.getElementById('heroCash').textContent = fmt(G.cash);
  // 折叠详情
  document.getElementById('total').textContent = fmt(total);
  const sellable = G.started ? sellableQty() : 0;
  document.getElementById('pos').textContent = G.pos===0?'0':fmtQty(G.pos);
  document.getElementById('sellable').textContent = G.pos===0?'0':fmtQty(sellable);
  document.getElementById('entry').textContent = G.pos===0?'--':G.entry.toFixed(2);
  const pnlEl = document.getElementById('pnl');
  pnlEl.textContent = (fp>=0?'+':'') + fmt(fp);
  pnlEl.className = 'v ' + (fp>0?'up':(fp<0?'down':''));
  document.getElementById('margin').textContent = fmt(G.marginUsed);
  document.getElementById('mr').textContent = G.pos===0?'--':((marginRatio(p)*100).toFixed(1)+'%');
  // 操作按钮状态：现金耗尽禁买入；大盘页禁用交易操作
  const canTrade = G.started && !G.over && G.page === 'trade';
  document.getElementById('longBtn').disabled = !canTrade || G.cash <= 1;
  document.getElementById('shortBtn').disabled = !canTrade;
  document.getElementById('nextBtn').disabled = !canTrade;
}
function fmtQty(q){ return q>=1000? (q/1000).toFixed(2)+'k' : q.toFixed(0); }

/* ===================== Canvas 绘图 ===================== */
const cvs = document.getElementById('chart');
const ctx = cvs.getContext('2d');
let cw=0, ch=0, dpr=1;
let mouse = {x:-1, y:-1, in:false};

function resize(){
  dpr = window.devicePixelRatio || 1;
  const r = cvs.getBoundingClientRect();
  cw = r.width; ch = r.height;
  cvs.width = cw*dpr; cvs.height = ch*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);
cvs.addEventListener('mousemove', e=>{
  const r = cvs.getBoundingClientRect();
  mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.in = true;
  draw();
});
cvs.addEventListener('mouseleave', ()=>{ mouse.in=false; draw(); });
/* 滚轮缩放：以鼠标位置为锚点；左右拖动平移回看历史；双击回到最新
   大盘页与对局页各自维护视窗（G.mktView / G.view） */
const drag = {on:false, startX:0, startBack:0, moved:false};
function curView(){ return G.page === 'market' ? G.mktView : G.view; }
function chartBars(){
  if(G.page === 'market') return (G.mkt && G.mkt.ready && G.mkt.idxBars) ? G.mkt.idxBars : [];
  return agg(G.tf, G.curTickIdx);
}
cvs.addEventListener('wheel', e=>{
  e.preventDefault();
  if(!G || !G.tickOHLC.length) return;
  const total = chartBars().length;
  if(!total) return;
  const v = curView();
  const r = cvs.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const padL = 8, padR = 64, plotW = cw - padL - padR;
  const count0 = Math.min(Math.max(v.count|0, 20), Math.max(20, total));
  const back0 = Math.min(Math.max(v.back|0, 0), Math.max(0, total - count0));
  const bw0 = plotW / count0;
  const gFloat = (total - back0 - count0) + (mx - padL)/bw0;   // 鼠标下的全局K线位置
  const count1 = Math.min(Math.max(Math.round(count0 * (e.deltaY>0 ? 1.15 : 0.87)), 20), Math.max(20, total));
  const bw1 = plotW / count1;
  let back1 = total - count1 - (gFloat - (mx - padL)/bw1);
  v.count = count1;
  v.back = Math.min(Math.max(Math.round(back1), 0), Math.max(0, total - count1));
  draw();
}, {passive:false});
cvs.addEventListener('mousedown', e=>{
  if(!G || !G.tickOHLC.length) return;
  const r = cvs.getBoundingClientRect();
  const x = e.clientX - r.left;
  drag.on = true; drag.startX = x; drag.startBack = curView().back|0; drag.moved = false;
  cvs.classList.add('grabbing');
});
window.addEventListener('mousemove', e=>{
  if(!drag.on) return;
  const r = cvs.getBoundingClientRect();
  const x = e.clientX - r.left;
  const v = curView();
  const total = chartBars().length;
  const padL = 8, padR = 64, plotW = cw - padL - padR;
  const cnt = Math.min(Math.max(v.count|0, 20), Math.max(20, total));
  const bw = plotW / cnt;
  if(Math.abs(x - drag.startX) > 4) drag.moved = true;
  v.back = Math.min(Math.max(Math.round(drag.startBack + (drag.startX - x)/bw), 0),
                     Math.max(0, total - cnt));
  draw();
});
window.addEventListener('mouseup', ()=>{
  if(drag.on){ drag.on = false; cvs.classList.remove('grabbing'); }
});
cvs.addEventListener('dblclick', ()=>{ if(G){ curView().back = 0; draw(); } });

function draw(){
  if(!G || !G.tickOHLC.length) return;   // 行情未就绪时不绘制
  if(cw===0 || ch===0) return; // 画布尺寸未就绪（resize 前），跳过首帧
  ctx.clearRect(0,0,cw,ch);
  const statsEl = document.getElementById('mktStats');
  if(G.page === 'market'){
    if(statsEl) statsEl.classList.add('show');
    drawMarket();
    return;
  }
  if(statsEl) statsEl.classList.remove('show');
  const loadingEl = document.getElementById('mktLoading');
  if(loadingEl) loadingEl.classList.remove('show');

  const allBars = agg(G.tf, G.curTickIdx);
  if(allBars.length===0) return;

  // 视窗：count=可见K线数（滚轮缩放），back=向右回看根数（拖动平移，0=跟随最新）
  const total = allBars.length;
  const view = G.view;
  view.count = Math.min(Math.max(view.count|0, 20), Math.max(20, total));
  view.back = Math.min(Math.max(view.back|0, 0), Math.max(0, total - view.count));
  const back = view.back, count = view.count;
  const visStart = Math.max(0, total - back - count);
  const bars = allBars.slice(visStart, total - back);

  const trading = G.started;

  // 布局：顶部主图 + 底部副图
  const padL = 8, padR = 64, padT = 10, padB = 18;
  const volH = 70;
  const volGap = 8;
  const mainH = ch - padT - padB - volH - volGap;
  const mainY0 = padT, mainY1 = padT + mainH;
  const volY0 = mainY1 + volGap, volY1 = volY0 + volH;

  const plotW = cw - padL - padR;

  // 价格范围（含主图指标）
  let hi=-Infinity, lo=Infinity;
  for(const b of bars){ if(b.h>hi)hi=b.h; if(b.l<lo)lo=b.l; }
  const maSeries = G.mainMa ? CFG.maPeriods.map(p=> calcMA(bars,p)) : null;
  const boll = G.mainBoll ? calcBOLL(bars) : null;
  const extend = v => { if(v!==null){ if(v>hi)hi=v; if(v<lo)lo=v; } };
  if(maSeries) maSeries.forEach(ms=> ms.forEach(extend));
  if(boll) boll.forEach(arr=> arr.forEach(extend));
  const pad = (hi-lo)*0.05;
  hi += pad; lo -= pad;
  if(hi===lo){ hi=lo*1.01; lo=lo*0.99; }

  const n = bars.length;
  const bw = plotW / count;   // 每根槽位宽度（按视窗容量，回看历史时右侧留空）
  const barW = Math.max(1.5, bw*0.6);

  const xAt = i => padL + i*bw + bw/2;
  const yP = p => mainY1 - (p-lo)/(hi-lo)*mainH;

  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.fillStyle = '#6b7280'; ctx.font='10px Consolas';
  ctx.lineWidth = 1;
  const gridN = 5;
  for(let i=0;i<=gridN;i++){
    const p = lo + (hi-lo)*i/gridN;
    const y = yP(p);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cw-padR,y); ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.stroke();
    ctx.fillStyle = '#6b7280'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(p.toFixed(2), cw-padR+4, y);
  }
  // 交易起点竖线（标记在交易开始所在周期根，即历史末根）
  if(trading){
    const tradeStartBar = Math.floor(G.tradeStartTick / CFG.tfs[G.tf]);
    const ti = bars.findIndex(b=> b.idx === tradeStartBar);
    if(ti>=0){
      const x = xAt(ti);
      ctx.strokeStyle = 'rgba(255,138,61,.5)'; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(x,mainY0); ctx.lineTo(x,volY1); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#ff8c42'; ctx.textAlign='left'; ctx.fillText('交易起点', x+4, mainY0+8);
    }
  }

  // 副图：VOL / MACD / KDJ / RSI
  drawSubIndicator(bars, G.subInd, {n, xAt, barW, padL, padR, cw, y0:volY0, y1:volY1, labelX:padL+84});

  // K线（上涨空心橙，下跌实心青绿）
  for(let i=0;i<n;i++){
    const b = bars[i];
    const x = xAt(i);
    const up = b.c>=b.o;
    const col = up? '#ff7a29':'#2dd4a0';
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth=1;
    // 影线
    ctx.beginPath(); ctx.moveTo(x, yP(b.h)); ctx.lineTo(x, yP(b.l)); ctx.stroke();
    // 实体
    const yo = yP(b.o), yc = yP(b.c);
    const top = Math.min(yo,yc), h = Math.max(1, Math.abs(yc-yo));
    if(up){
      ctx.fillStyle = '#060708'; ctx.fillRect(x-barW/2, top, barW, h); // 空心：填背景
      ctx.strokeRect(x-barW/2, top, barW, h);                          // 橙边
    } else {
      ctx.fillRect(x-barW/2, top, barW, h);                            // 实心青绿
    }
  }

  // 主图指标：MA / BOLL（可同时开启）
  const maCols = ['#f5a623','#4fc3f7','#e040fb'];
  let labelX = padL + 84;
  ctx.font='11px Consolas'; ctx.textAlign='left'; ctx.textBaseline='top';
  if(G.mainMa){
    CFG.maPeriods.forEach((p,pi)=>{
      const ms = maSeries[pi];
      ctx.strokeStyle = maCols[pi]; ctx.lineWidth=1.2;
      ctx.beginPath();
      let started=false;
      for(let i=0;i<n;i++){
        const v = ms[i];
        if(v===null) { started=false; continue; }
        const x = xAt(i), y = yP(v);
        if(!started){ ctx.moveTo(x,y); started=true; }
        else ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.fillStyle = maCols[pi];
      ctx.fillText('MA'+p, labelX, mainY0+2); labelX += 54;
    });
  }
  if(G.mainBoll){
    const [bMid,bUp,bDn] = boll;
    // 通道填充
    ctx.fillStyle='rgba(110,130,180,0.12)'; ctx.beginPath();
    let st=false;
    for(let i=0;i<n;i++){ if(bUp[i]===null){st=false;continue;} const x=xAt(i),y=yP(bUp[i]); if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y); }
    for(let i=n-1;i>=0;i--){ if(bDn[i]===null) continue; const x=xAt(i),y=yP(bDn[i]); ctx.lineTo(x,y); }
    ctx.closePath(); ctx.fill();
    const drawLine=(arr,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=1; ctx.beginPath(); let s=false; for(let i=0;i<n;i++){ if(arr[i]===null){s=false;continue;} const x=xAt(i),y=yP(arr[i]); if(!s){ctx.moveTo(x,y);s=true;}else ctx.lineTo(x,y);} ctx.stroke(); };
    drawLine(bUp,'#6e82b4'); drawLine(bDn,'#6e82b4'); drawLine(bMid,'#f5c864');
    ctx.fillStyle='#f5c864';
    ctx.fillText('BOLL', labelX, mainY0+2);
  }

  // 十字光标：竖线=K线信息（日期+OHLC），横线=价格标签（精确到分）
  if(mouse.in && mouse.x>=padL && mouse.x<=padL+plotW){
    const idx = Math.floor((mouse.x - padL)/bw);
    if(idx>=0 && idx<n){
      const b = bars[idx];
      const x = xAt(idx);
      ctx.strokeStyle='rgba(255,138,61,.55)'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
      // 竖线（K线时间轴）
      ctx.beginPath(); ctx.moveTo(x,mainY0); ctx.lineTo(x,volY1); ctx.stroke();
      // 横线（价格轴）
      ctx.beginPath(); ctx.moveTo(padL,mouse.y); ctx.lineTo(cw-padR,mouse.y); ctx.stroke();
      ctx.setLineDash([]);
      // 横线右侧价格标签：精确到分（0.01）
      const hoverPrice = lo + (hi-lo) * (mainY1 - Math.min(Math.max(mouse.y,mainY0),mainY1)) / mainH;
      const priceTxt = hoverPrice.toFixed(2);
      ctx.font='bold 11px Consolas';
      ctx.fillStyle='#ff6a1a';
      ctx.fillRect(cw-padR, mouse.y-9, padR-2, 18);
      ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(priceTxt, cw-padR+5, mouse.y);
      // 竖线信息框：日期 + 开高低收
      const dateStr = b.date ? b.date : (tfName(G.tf)+' #'+idx);
      const rows = [['日期', dateStr], ['开盘', b.o.toFixed(2)], ['最高', b.h.toFixed(2)], ['最低', b.l.toFixed(2)], ['收盘', b.c.toFixed(2)]];
      const rowH = 17, pw = 132, ph = rows.length * rowH + 8;
      let bx = x + 12; if(bx + pw > cw - padR) bx = x - 12 - pw;
      let by = Math.min(Math.max(mouse.y - ph/2, mainY0 + 2), volY1 - ph - 2);
      ctx.fillStyle='rgba(16,18,22,.95)'; ctx.strokeStyle='rgba(255,106,26,.4)';
      ctx.fillRect(bx,by,pw,ph); ctx.strokeRect(bx,by,pw,ph);
      ctx.font='11px Microsoft YaHei'; ctx.textBaseline='top';
      const valCol = b.c>=b.o? '#ff8c42':'#45e8bd';  // 数值颜色随该K线涨跌
      rows.forEach((r,i)=>{
        const yy = by + 5 + i * rowH;
        ctx.fillStyle='#8b8f98'; ctx.textAlign='left';
        ctx.fillText(r[0], bx+8, yy);
        ctx.fillStyle= i===0 ? '#d4d9e3' : valCol; ctx.textAlign='right';
        ctx.fillText(r[1], bx+pw-8, yy);
      });
    }
  }

  // 未结算且最新K线在视窗内（跟随状态）时，画最新价线
  if(!G.over && back===0){
    const p = curPrice();
    const y = yP(p);
    ctx.strokeStyle='rgba(255,138,61,.6)'; ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cw-padR,y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#ff6a1a'; ctx.fillRect(cw-padR, y-9, padR-2, 18);
    ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font='bold 11px Consolas';
    ctx.fillText(p.toFixed(2), cw-padR+5, y);
  }

  // 回看历史时显示"回到最新"按钮
  const tl = document.getElementById('toLatest');
  if(tl) tl.style.display = (back>0 && !G.over) ? '' : 'none';
}

/* 副图通用绘制：VOL / MACD / KDJ / RSI
   P = {n, xAt(i), barW, padL, padR, cw, y0, y1, labelX} */
function drawSubIndicator(bars, sub, P){
  const {n, xAt, barW, padL, padR, cw, y0, y1} = P;
  const h = y1 - y0;
  ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.strokeRect(padL,y0,cw-padL-padR,h);
  ctx.font='11px Consolas'; ctx.textAlign='left'; ctx.textBaseline='top';
  if(sub==='VOL'){
    let vMax=0; for(let i=0;i<n;i++) if(bars[i].v>vMax) vMax=bars[i].v;
    const yV = v => y1 - (vMax>0? v/vMax*h : 0);
    for(let i=0;i<n;i++){
      const b = bars[i];
      const x = xAt(i);
      ctx.fillStyle = b.c>=b.o? '#ff7a29':'#2dd4a0';
      ctx.fillRect(x-barW/2, yV(b.v), barW, y1-yV(b.v));
    }
    ctx.fillStyle='#6b7280'; ctx.fillText('VOL', P.labelX, y0+2);
  } else if(sub==='MACD'){
    const m = calcMACD(bars);
    const vals = [...m.dif,...m.dea,...m.macd].filter(v=>v!==null);
    if(vals.length){
      const mmax = Math.max(Math.abs(Math.max(...vals)), Math.abs(Math.min(...vals)), 1e-9);
      const zeroY = (y0+y1)/2;
      const yM = v => zeroY - v/mmax*(h/2-4);
      for(let i=0;i<n;i++){
        if(m.macd[i]===null) continue;
        const x = xAt(i);
        ctx.fillStyle = m.macd[i]>=0? '#ff7a29':'#2dd4a0';
        const y = yM(m.macd[i]);
        if(m.macd[i]>=0) ctx.fillRect(x-barW/2, y, barW, zeroY-y);
        else ctx.fillRect(x-barW/2, zeroY, barW, y-zeroY);
      }
      ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.moveTo(padL,zeroY); ctx.lineTo(cw-padR,zeroY); ctx.stroke();
      const drawLine=(arr,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=1; ctx.beginPath(); let s=false; for(let i=0;i<n;i++){ if(arr[i]===null){s=false;continue;} const x=xAt(i),y=yM(arr[i]); if(!s){ctx.moveTo(x,y);s=true;}else ctx.lineTo(x,y);} ctx.stroke(); };
      drawLine(m.dif,'#e6e6e6'); drawLine(m.dea,'#ffc832');
    }
    ctx.fillStyle='#6b7280'; ctx.fillText('MACD', P.labelX, y0+2);
    ctx.fillStyle='#e6e6e6'; ctx.fillText('DIF', P.labelX+46, y0+2);
    ctx.fillStyle='#ffc832'; ctx.fillText('DEA', P.labelX+82, y0+2);
  } else if(sub==='KDJ'){
    const kdj = calcKDJ(bars);
    const yV = v => y1 - (Math.min(Math.max(v,-10),110)+10)/120*h;
    ctx.strokeStyle='rgba(255,255,255,.08)';
    [20,80].forEach(lv=>{ const y=yV(lv); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cw-padR,y); ctx.stroke(); });
    ctx.fillStyle='#5b6472'; ctx.textAlign='right'; ctx.fillText('80', cw-padR-3, yV(80)-6); ctx.fillText('20', cw-padR-3, yV(20)+1);
    const drawLine=(arr,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=1; ctx.beginPath(); let s=false; for(let i=0;i<n;i++){ if(arr[i]===null){s=false;continue;} const x=xAt(i),y=yV(arr[i]); if(!s){ctx.moveTo(x,y);s=true;}else ctx.lineTo(x,y);} ctx.stroke(); };
    drawLine(kdj.K,'#e6e6e6'); drawLine(kdj.D,'#ffc832'); drawLine(kdj.J,'#e040fb');
    ctx.textAlign='left'; ctx.fillStyle='#6b7280'; ctx.fillText('KDJ', P.labelX, y0+2);
    ctx.fillStyle='#e6e6e6'; ctx.fillText('K', P.labelX+38, y0+2);
    ctx.fillStyle='#ffc832'; ctx.fillText('D', P.labelX+58, y0+2);
    ctx.fillStyle='#e040fb'; ctx.fillText('J', P.labelX+78, y0+2);
  } else { // RSI
    const rsi = calcRSI(bars);
    const yV = v => y1 - v/100*h;
    ctx.strokeStyle='rgba(255,255,255,.08)';
    [30,70].forEach(lv=>{ const y=yV(lv); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cw-padR,y); ctx.stroke(); });
    ctx.fillStyle='#5b6472'; ctx.textAlign='right'; ctx.fillText('70', cw-padR-3, yV(70)-6); ctx.fillText('30', cw-padR-3, yV(30)+1);
    const cols = ['#f5a623','#4fc3f7','#e040fb'];
    rsi.forEach((arr,pi)=>{ ctx.strokeStyle=cols[pi]; ctx.lineWidth=1; ctx.beginPath(); let s=false; for(let i=0;i<n;i++){ if(arr[i]===null){s=false;continue;} const x=xAt(i),y=yV(arr[i]); if(!s){ctx.moveTo(x,y);s=true;}else ctx.lineTo(x,y);} ctx.stroke(); });
    ctx.textAlign='left'; ctx.fillStyle='#6b7280'; ctx.fillText('RSI', P.labelX, y0+2);
    [6,12,24].forEach((p,pi)=>{ ctx.fillStyle=cols[pi]; ctx.fillText(String(p), P.labelX+34+pi*28, y0+2); });
  }
}

/* ===================== 大盘页绘制 ===================== */
function drawMarket(){
  const mk = G.mkt;
  const loadingEl = document.getElementById('mktLoading');
  const statsEl = document.getElementById('mktStats');
  if(!mk || (!mk.ready && !mk.failed)){
    if(loadingEl){ loadingEl.classList.add('show'); loadingEl.textContent = '大盘行情加载中…'; }
    const tl = document.getElementById('toLatest'); if(tl) tl.style.display='none';
    return;
  }
  if(mk.failed || !mk.idxBars){
    if(loadingEl){ loadingEl.classList.add('show'); loadingEl.textContent = '大盘数据加载失败（网络原因），可回对局页继续游戏'; }
    const tl = document.getElementById('toLatest'); if(tl) tl.style.display='none';
    return;
  }
  if(loadingEl) loadingEl.classList.remove('show');

  // 顶部统计条（仅在数据变化时写 DOM）
  const sig = [mk.up,mk.down,mk.ping,mk.zt,mk.dt,mk.idxChg,mk.ready].join('|');
  if(statsEl && statsEl.dataset.sig !== sig){
    statsEl.dataset.sig = sig;
    const cls = v => v>=0 ? 'up' : 'down';
    const sign = v => (v>=0?'+':'') + v.toFixed(2) + '%';
    statsEl.innerHTML =
      '<span class="mkt-chip">' + mk.idxName + '<b class="'+cls(mk.idxChg)+'">' + sign(mk.idxChg) + '</b></span>'
      + '<span class="mkt-chip">上涨 <b class="up">' + mk.up + '</b></span>'
      + '<span class="mkt-chip">下跌 <b class="down">' + mk.down + '</b></span>'
      + '<span class="mkt-chip">平盘 <b>' + mk.ping + '</b></span>'
      + '<span class="mkt-chip">涨停 <b class="up">' + mk.zt + '</b></span>'
      + '<span class="mkt-chip">跌停 <b class="down">' + mk.dt + '</b></span>'
      + (mk.sim ? '<span class="mkt-chip">模拟数据</span>' : '');
  }

  const padL = 8, padR = 64;
  const plotW = cw - padL - padR;
  const charts = [{title: mk.idxName, bars: mk.idxBars}];
  if(mk.boardBars) charts.push({title: '板块指数', bars: mk.boardBars});

  const top0 = 46, bottomGap = 10;
  const blockH = (ch - top0 - bottomGap) / charts.length;
  const subH = Math.min(58, blockH*0.22), gap = 6;

  // 共享视窗
  const view = G.mktView;
  const total = mk.idxBars.length;
  view.count = Math.min(Math.max(view.count|0, 20), Math.max(20, total));
  view.back = Math.min(Math.max(view.back|0, 0), Math.max(0, total - view.count));
  const count = view.count, back = view.back;

  charts.forEach((ch_, ci)=>{
    const all = ch_.bars;
    const t2 = all.length;
    const vs = Math.max(0, t2 - back - count);
    const bars = all.slice(vs, t2 - back);
    const n = bars.length;
    if(!n) return;

    const by0 = top0 + ci*blockH + 4;
    const mainY1 = by0 + (blockH - 8 - subH - gap);
    const mainY0 = by0 + 14;  // 标题行
    const volY0 = mainY1 + gap, volY1 = volY0 + subH;

    let hi=-Infinity, lo=Infinity;
    for(const b of bars){ if(b.h>hi)hi=b.h; if(b.l<lo)lo=b.l; }
    const maSeries = G.mainMa ? CFG.maPeriods.map(p=> calcMA(bars,p)) : null;
    const boll = G.mainBoll ? calcBOLL(bars) : null;
    const extend = v => { if(v!==null){ if(v>hi)hi=v; if(v<lo)lo=v; } };
    if(maSeries) maSeries.forEach(ms=> ms.forEach(extend));
    if(boll) boll.forEach(arr=> arr.forEach(extend));
    const pad = (hi-lo)*0.05; hi+=pad; lo-=pad;
    if(hi===lo){ hi=lo*1.01; lo=lo*0.99; }

    const bw = plotW / count;
    const barW = Math.max(1.2, bw*0.6);
    const xAt = i => padL + i*bw + bw/2;
    const yP = p => mainY1 - (p-lo)/(hi-lo)*(mainY1-mainY0);

    // 标题
    ctx.fillStyle = '#d4d9e3'; ctx.font='bold 12px Microsoft YaHei'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(ch_.title, padL+4, by0);
    const lastC = bars[n-1].c, prevC = n>1 ? bars[n-1].c : bars[n-1].o;
    const dayChg = (bars[n-1].c/bars[n-1].o-1)*100;
    ctx.fillStyle = dayChg>=0 ? '#ff7a29' : '#2dd4a0';
    ctx.font='11px Consolas';
    ctx.fillText(lastC.toFixed(2) + '  ' + (dayChg>=0?'+':'') + dayChg.toFixed(2) + '%', padL+78, by0+1);

    // 网格 + 价格轴
    ctx.font='10px Consolas';
    for(let i=0;i<=4;i++){
      const p = lo + (hi-lo)*i/4;
      const y = yP(p);
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(cw-padR,y); ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.stroke();
      ctx.fillStyle='#6b7280'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(p.toFixed(2), cw-padR+4, y);
    }
    // K线
    for(let i=0;i<n;i++){
      const b = bars[i];
      const x = xAt(i);
      const up = b.c>=b.o;
      const col = up? '#ff7a29':'#2dd4a0';
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x, yP(b.h)); ctx.lineTo(x, yP(b.l)); ctx.stroke();
      const yo = yP(b.o), yc = yP(b.c);
      const top = Math.min(yo,yc), hh = Math.max(1, Math.abs(yc-yo));
      if(up){ ctx.fillStyle='#060708'; ctx.fillRect(x-barW/2, top, barW, hh); ctx.strokeRect(x-barW/2, top, barW, hh); }
      else { ctx.fillRect(x-barW/2, top, barW, hh); }
    }
    // 主图指标
    const maCols = ['#f5a623','#4fc3f7','#e040fb'];
    if(G.mainMa){
      CFG.maPeriods.forEach((p,pi)=>{
        const ms = maSeries[pi];
        ctx.strokeStyle = maCols[pi]; ctx.lineWidth=1.1;
        ctx.beginPath(); let st=false;
        for(let i=0;i<n;i++){ if(ms[i]===null){st=false;continue;} const x=xAt(i),y=yP(ms[i]); if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y); }
        ctx.stroke();
      });
    }
    if(G.mainBoll){
      const [,bUp,bDn] = boll;
      const drawLine=(arr,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=1; ctx.beginPath(); let s=false; for(let i=0;i<n;i++){ if(arr[i]===null){s=false;continue;} const x=xAt(i),y=yP(arr[i]); if(!s){ctx.moveTo(x,y);s=true;}else ctx.lineTo(x,y);} ctx.stroke(); };
      drawLine(bUp,'#6e82b4'); drawLine(bDn,'#6e82b4');
    }
    // 副图指标（与对局页同一组指标）
    drawSubIndicator(bars, G.subInd, {n, xAt, barW, padL, padR, cw, y0:volY0, y1:volY1, labelX:padL+200});

    // 十字光标
    if(mouse.in && mouse.x>=padL && mouse.x<=padL+plotW && mouse.y>=mainY0 && mouse.y<=volY1){
      const idx = Math.floor((mouse.x - padL)/bw);
      if(idx>=0 && idx<n){
        const b = bars[idx];
        const x = xAt(idx);
        ctx.strokeStyle='rgba(255,138,61,.55)'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x,mainY0); ctx.lineTo(x,volY1); ctx.stroke();
        if(mouse.y>=mainY0 && mouse.y<=mainY1){
          ctx.beginPath(); ctx.moveTo(padL,mouse.y); ctx.lineTo(cw-padR,mouse.y); ctx.stroke();
          const hoverPrice = lo + (hi-lo) * (mainY1 - Math.min(Math.max(mouse.y,mainY0),mainY1))/(mainY1-mainY0);
          ctx.setLineDash([]);
          ctx.font='bold 11px Consolas';
          ctx.fillStyle='#ff6a1a'; ctx.fillRect(cw-padR, mouse.y-9, padR-2, 18);
          ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
          ctx.fillText(hoverPrice.toFixed(2), cw-padR+5, mouse.y);
        } else ctx.setLineDash([]);
        const rows = [['日期', b.date||'--'], ['开盘', b.o.toFixed(2)], ['最高', b.h.toFixed(2)], ['最低', b.l.toFixed(2)], ['收盘', b.c.toFixed(2)]];
        const rowH = 16, pw = 126, ph = rows.length*rowH+8;
        let bx = x+12; if(bx+pw>cw-padR) bx = x-12-pw;
        let by = Math.min(Math.max(mouse.y-ph/2, mainY0+2), volY1-ph-2);
        ctx.fillStyle='rgba(16,18,22,.95)'; ctx.strokeStyle='rgba(255,106,26,.4)';
        ctx.fillRect(bx,by,pw,ph); ctx.strokeRect(bx,by,pw,ph);
        ctx.font='11px Microsoft YaHei'; ctx.textBaseline='top';
        const valCol = b.c>=b.o? '#ff8c42':'#45e8bd';
        rows.forEach((r,i)=>{
          const yy = by+5+i*rowH;
          ctx.fillStyle='#8b8f98'; ctx.textAlign='left'; ctx.fillText(r[0], bx+8, yy);
          ctx.fillStyle= i===0?'#d4d9e3':valCol; ctx.textAlign='right'; ctx.fillText(r[1], bx+pw-8, yy);
        });
      }
    }
  });

  const tl = document.getElementById('toLatest');
  if(tl) tl.style.display = back>0 ? '' : 'none';
}

function tfName(tf){ return {M:'月',W:'周',D:'日','240':'4h','60':'1h','30':'30m','15':'15m'}[tf]; }

function calcMA(bars, period){
  const out = new Array(bars.length).fill(null);
  let sum=0;
  for(let i=0;i<bars.length;i++){
    sum += bars[i].c;
    if(i>=period) sum -= bars[i-period].c;
    if(i>=period-1) out[i] = sum/period;
  }
  return out;
}
function calcEMA(vals, period){
  const out = new Array(vals.length).fill(null);
  if(vals.length===0) return out;
  const k = 2/(period+1);
  let e = vals[0];
  for(let i=0;i<vals.length;i++){
    e = i===0? vals[0] : vals[i]*k + e*(1-k);
    out[i] = e;
  }
  return out;
}
function calcMACD(bars){
  const closes = bars.map(b=>b.c);
  const ema12 = calcEMA(closes, 12);
  const ema26 = calcEMA(closes, 26);
  const dif = closes.map((_,i)=> (ema12[i]!==null && ema26[i]!==null)? ema12[i]-ema26[i] : null);
  // DEA = EMA(dif,9)，跳过 null
  const dea = new Array(bars.length).fill(null);
  const k = 2/(9+1); let e=null;
  for(let i=0;i<dif.length;i++){
    if(dif[i]===null) continue;
    e = e===null? dif[i] : dif[i]*k + e*(1-k);
    dea[i] = e;
  }
  const macd = dif.map((v,i)=> (v!==null && dea[i]!==null)? 2*(v-dea[i]) : null);
  return {dif, dea, macd};
}
function calcBOLL(bars, period=20, kk=2){
  const mid = new Array(bars.length).fill(null);
  const up = new Array(bars.length).fill(null);
  const dn = new Array(bars.length).fill(null);
  for(let i=0;i<bars.length;i++){
    if(i>=period-1){
      const seg = [];
      for(let j=i-period+1;j<=i;j++) seg.push(bars[j].c);
      const m = seg.reduce((a,b)=>a+b,0)/period;
      const variance = seg.reduce((a,b)=>a+(b-m)*(b-m),0)/period;
      const sd = Math.sqrt(variance);
      mid[i]=m; up[i]=m+kk*sd; dn[i]=m-kk*sd;
    }
  }
  return [mid, up, dn];
}
/* KDJ(9,3,3)：RSV=(C-L9)/(H9-L9)*100；K=2/3前K+1/3RSV，D=2/3前D+1/3K，J=3K-2D */
function calcKDJ(bars, n=9){
  const K=[], D=[], J=[];
  let k=50, d=50;
  for(let i=0;i<bars.length;i++){
    if(i < n-1){ K.push(null); D.push(null); J.push(null); continue; }
    let hn=-Infinity, ln=Infinity;
    for(let j=i-n+1;j<=i;j++){ if(bars[j].h>hn)hn=bars[j].h; if(bars[j].l<ln)ln=bars[j].l; }
    const rsv = hn>ln ? (bars[i].c-ln)/(hn-ln)*100 : 50;
    k = 2/3*k + 1/3*rsv;
    d = 2/3*d + 1/3*k;
    K.push(k); D.push(d); J.push(3*k-2*d);
  }
  return {K, D, J};
}
/* RSI(6/12/24)：Wilder 平滑 */
function calcRSI(bars, periods=[6,12,24]){
  const closes = bars.map(b=>b.c);
  return periods.map(n=>{
    const out = new Array(bars.length).fill(null);
    if(closes.length < n+1) return out;
    let gain=0, loss=0;
    for(let i=1;i<=n;i++){
      const ch = closes[i]-closes[i-1];
      if(ch>0) gain+=ch; else loss-=ch;
    }
    let ag = gain/n, al = loss/n;
    out[n] = al===0 ? 100 : 100 - 100/(1+ag/al);
    for(let i=n+1;i<closes.length;i++){
      const ch = closes[i]-closes[i-1];
      ag = (ag*(n-1) + (ch>0?ch:0))/n;
      al = (al*(n-1) + (ch<0?-ch:0))/n;
      out[i] = al===0 ? 100 : 100 - 100/(1+ag/al);
    }
    return out;
  });
}

// 复盘按钮：进入复盘界面
document.getElementById('reviewBtn').addEventListener('click', ()=>{
  if(G && G.lastSnap) enterReview(G.lastSnap);
});
// 存档按钮：将当前对局从最近记录移到存档
document.getElementById('archiveBtn').addEventListener('click', ()=>{
  if(G && G.lastSnap){
    archiveGame(G.lastSnap.id);
    document.getElementById('archiveBtn').textContent = '已存档';
    document.getElementById('archiveBtn').disabled = true;
  }
});
// 复盘返回按钮
document.getElementById('rvBack').addEventListener('click', exitReview);
// 弹窗右上角 X 关闭按钮
document.getElementById('tipX').addEventListener('click', hideTip);
document.getElementById('rvX').addEventListener('click', exitReview);
document.getElementById('ctX').addEventListener('click', closeCenter);
document.getElementById('endX').addEventListener('click', ()=>{
  // 结算弹窗X：关闭弹窗露出图表，右下角浮动条提供再来一局/复盘
  document.getElementById('mask').classList.remove('show');
  document.getElementById('endFloat').classList.add('show');
});
document.getElementById('floatAgain').addEventListener('click', ()=>{
  document.getElementById('endFloat').classList.remove('show');
  newGame(false);
});
document.getElementById('floatReview').addEventListener('click', ()=>{
  if(G && G.lastSnap) enterReview(G.lastSnap);
});
// 账户详情折叠/展开
document.getElementById('detailToggle').addEventListener('click', ()=>{
  const box = document.getElementById('detailBox');
  const open = box.classList.toggle('open');
  document.getElementById('detailToggle').textContent = open ? '账户详情 ▾' : '账户详情 ▸';
});
// 个人中心（开始界面按钮 + 右上角头像，两个入口）
document.getElementById('centerBtn').addEventListener('click', openCenter);
document.getElementById('avatarBtn').addEventListener('click', ()=>{ hideTip(); openCenter(); });
document.getElementById('centerBack').addEventListener('click', closeCenter);
document.getElementById('modeGuest').addEventListener('click', ()=>setLoginTab('guest'));
document.getElementById('modeLogin').addEventListener('click', ()=>setLoginTab('login'));
document.getElementById('guestBtn').addEventListener('click', guestEnter);
document.getElementById('getCode').addEventListener('click', sendCode);
document.getElementById('doLogin').addEventListener('click', doLogin);
document.getElementById('logoutBtn').addEventListener('click', logout);
document.querySelectorAll('#centerMain .btn.pos[data-cap]').forEach(b=>{
  b.addEventListener('click', ()=>setCapital(b.dataset.cap));
});
document.getElementById('capCustom').addEventListener('change', e=>{
  if(e.target.value) setCapital(e.target.value);
});
// 行情加载失败后的手动重试
document.getElementById('retryBtn').addEventListener('click', ()=>{
  newGame(false);
});
// 开始弹窗 X：关闭弹窗露出图表，右下角浮动条提供开始/个人中心
document.getElementById('startX').addEventListener('click', ()=>{
  document.getElementById('startMask').classList.remove('show');
  document.getElementById('startFloat').classList.add('show');
});
document.getElementById('floatStart').addEventListener('click', ()=>{
  document.getElementById('startFloat').classList.remove('show');
  startTrade();
});
document.getElementById('floatCenter').addEventListener('click', openCenter);
// 昵称保存
document.getElementById('nickSave').addEventListener('click', saveNick);
document.getElementById('nickInput').addEventListener('keydown', e=>{
  if(e.code === 'Enter'){ e.stopPropagation(); saveNick(); }
});

/* ===== 左侧导航：对局 / 大盘 ===== */
function setPage(p){
  if(!G) return;
  G.page = p;
  document.getElementById('navTrade').classList.toggle('active', p === 'trade');
  document.getElementById('navMarket').classList.toggle('active', p === 'market');
  mouse.in = false;
  draw(); updateUI();
}
document.getElementById('navTrade').addEventListener('click', ()=> setPage('trade'));
document.getElementById('navMarket').addEventListener('click', ()=> setPage('market'));

/* ===== 指标折叠面板 ===== */
document.getElementById('indToggle').addEventListener('click', ()=>{
  const box = document.getElementById('indBox');
  const open = box.classList.toggle('show');
  document.getElementById('indToggle').textContent = open ? '指标 ▾' : '指标 ▸';
});
document.querySelectorAll('.ind-chip[data-main]').forEach(c=> c.addEventListener('click', ()=>{
  const key = c.dataset.main;
  if(key === 'ma') G.mainMa = !G.mainMa;
  if(key === 'boll') G.mainBoll = !G.mainBoll;
  if(!G.mainMa && !G.mainBoll) G.mainMa = true;   // 至少保留一个主图指标
  syncIndChips(); draw();
}));
document.querySelectorAll('.ind-chip[data-sub]').forEach(c=> c.addEventListener('click', ()=>{
  G.subInd = c.dataset.sub;
  syncIndChips(); draw();
}));
function syncIndChips(){
  document.querySelectorAll('.ind-chip[data-main]').forEach(c=>{
    c.classList.toggle('on', c.dataset.main === 'ma' ? G.mainMa : G.mainBoll);
  });
  document.querySelectorAll('.ind-chip[data-sub]').forEach(c=>{
    c.classList.toggle('on', c.dataset.sub === G.subInd);
  });
}

/* ===== 交易弹窗（手数输入） ===== */
document.getElementById('tradeX').addEventListener('click', closeTrade);
document.getElementById('tradeCancel').addEventListener('click', closeTrade);
document.getElementById('tradeOk').addEventListener('click', confirmTrade);
document.querySelectorAll('.trade-frac .btn[data-tfrac]').forEach(b=>{
  b.addEventListener('click', ()=> setTradeLots(parseFloat(b.dataset.tfrac)));
});
document.getElementById('lotInput').addEventListener('keydown', e=>{
  e.stopPropagation();
  if(e.code === 'Enter'){ e.preventDefault(); confirmTrade(); }
  if(e.code === 'Escape'){ closeTrade(); }
});

/* ===== 重玩上局（不计入历史） ===== */
document.getElementById('replayBtn').addEventListener('click', newReplay);
document.getElementById('floatReplay').addEventListener('click', newReplay);

// 回到最新（大盘页/对局页各自的视窗）
document.getElementById('toLatest').addEventListener('click', ()=>{ if(G){ curView().back=0; draw(); } });

/* 键盘快捷键：结算画面按 R 重新开始 / 开始界面按任意键开始交易 */
document.addEventListener('keydown', (e)=>{
  if(!G) return;
  // 在输入框内打字时不触发游戏快捷键
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  // 复盘弹窗打开中：Esc/Enter/空格 返回
  if(document.getElementById('reviewMask').classList.contains('show')){
    if(e.code === 'Escape' || e.code === 'Enter' || e.code === 'Space'){ e.preventDefault(); exitReview(); }
    return;
  }
  // 个人中心弹窗打开中：Esc 关闭
  if(document.getElementById('centerMask').classList.contains('show')){
    if(e.code === 'Escape') closeCenter();
    return;
  }
  // 提示弹窗打开中：Esc/Enter/空格 关闭
  if(document.getElementById('tipMask').classList.contains('show')){
    if(e.code === 'Escape' || e.code === 'Enter' || e.code === 'Space'){ e.preventDefault(); hideTip(); }
    return;
  }
  // 交易弹窗打开中：Esc=取消，Enter=确认
  if(document.getElementById('tradeMask').classList.contains('show')){
    if(e.code === 'Escape'){ e.preventDefault(); closeTrade(); }
    else if(e.code === 'Enter'){ e.preventDefault(); confirmTrade(); }
    return;
  }
  // 结算弹窗打开中：Esc=关闭弹窗(显示浮动条)，R=再来一局
  if(G.over){
    if(e.key === 'r' || e.key === 'R' || e.code === 'KeyR'){
      document.getElementById('mask').classList.remove('show');
      document.getElementById('endFloat').classList.remove('show');
      newGame(true);
    } else if(e.code === 'Escape' && document.getElementById('mask').classList.contains('show')){
      document.getElementById('mask').classList.remove('show');
      document.getElementById('endFloat').classList.add('show');
    }
    return;
  }
  // 开始弹窗打开中：Esc=最小化到浮动条，回车/空格=开始
  if(!G.started){
    if(document.getElementById('startMask').classList.contains('show')){
      if(e.code === 'Escape'){
        document.getElementById('startMask').classList.remove('show');
        document.getElementById('startFloat').classList.add('show');
      }else if((e.code === 'Enter' || e.code === 'Space') && !G.loading){
        e.preventDefault(); startTrade();
      }
    }
    return;
  }
  // 交易中快捷键：空格/回车/→ = 下一步，B = 买入，S = 卖出
  if(e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight'){
    e.preventDefault(); stepNext();
  } else if(e.key === 'b' || e.key === 'B' || e.code === 'KeyB'){
    doBuy();
  } else if(e.key === 's' || e.key === 'S' || e.code === 'KeyS'){
    doSell();
  }
});

/* ===================== 启动 ===================== */
refreshAvatar();   // 头像按登录态初始化
newGame();
resize();
</script>
</body>
</html>
