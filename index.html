<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟股票交易小游戏</title>
<style>
  /* ===== Coincore 风格设计 token：深黑底 + 橙色强调 + 圆角卡片 ===== */
  :root{
    --bg:#060708; --panel:#101216; --panel2:rgba(255,255,255,.03);
    --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.05);
    --txt:#f2f4f8; --txt2:#9aa0aa; --txt3:#6b7280;
    --accent:#ff6a1a; --accent2:#ff8c42; --accent-soft:rgba(255,106,26,.14);
    --up:#ff7a29;          /* 涨：橙（主题色） */
    --down:#2dd4a0;        /* 跌：青绿 */
    --radius:14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    background: var(--bg); color: var(--txt);
    user-select: none; overflow: hidden; height: 100vh;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* 顶部工具栏 */
  .topbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px; background: rgba(10,11,13,.92);
    border-bottom: 1px solid var(--border); font-size: 13px;
    backdrop-filter: blur(8px);
  }
  .group { display: flex; align-items: center; gap: 4px; }
  .group + .group { margin-left: 10px; padding-left: 10px; border-left: 1px solid var(--border2); }
  .label { color: var(--txt3); font-size: 12px; margin-right: 4px; }
  button.btn {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 9px; cursor: pointer; font-size: 14px;
    transition: .15s; font-family: inherit;
  }
  .ind-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .ind-row .btn { padding: 4px 10px; font-size: 12px; }
  button.btn:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.16); }
  button.btn.active { background: var(--accent); border-color: var(--accent2); color: #fff; }
  button.btn:disabled { opacity: .35; cursor: not-allowed; }
  /* 周期按钮 */
  button.btn.tf { background: var(--panel2); border-color: var(--border); color: var(--txt2); }
  button.btn.tf:hover { background: rgba(255,255,255,.07); }
  button.btn.tf.active { background: var(--accent); border-color: var(--accent2); color: #fff; }
  /* 杠杆按钮 */
  button.btn.lev { background: var(--accent-soft); border-color: rgba(255,106,26,.3); color: var(--accent2); }
  button.btn.lev:hover { background: rgba(255,106,26,.22); }
  button.btn.lev.active { background: var(--accent); border-color: var(--accent2); color: #fff; font-weight: 600; }
  /* 买入按钮：橙渐变 */
  button.btn.long {
    background: linear-gradient(180deg,#ff8a3d,#ff6a1a); border: 1px solid #ff8c42;
    color: #fff; font-weight: 700; box-shadow: 0 4px 14px rgba(255,106,26,.25);
  }
  button.btn.long:hover { filter: brightness(1.08); }
  /* 卖出按钮：青绿 */
  button.btn.short {
    background: linear-gradient(180deg,#2fe0ac,#1fb88c); border: 1px solid #45e8bd;
    color: #052018; font-weight: 700; box-shadow: 0 4px 14px rgba(45,212,160,.2);
  }
  button.btn.short:hover { filter: brightness(1.08); }
  /* 下一步按钮：蓝色（区别于买入橙/卖出青绿） */
  button.btn.next {
    background: linear-gradient(180deg,#5b8dff,#3a63e0); border: 1px solid #7aa2ff;
    color: #fff; font-weight: 700; padding: 13px; font-size: 15px; letter-spacing: 2px;
    border-radius: 11px; box-shadow: 0 6px 18px rgba(70,110,255,.32);
  }
  button.btn.next:hover { filter: brightness(1.08); }
  /* 仓位选择按钮 */
  button.btn.pos { background: var(--panel2); border-color: var(--border); color: var(--txt2); padding: 8px 14px; font-size: 14px; }
  button.btn.pos:hover { background: rgba(255,255,255,.07); }
  button.btn.pos.active { background: var(--accent); border-color: var(--accent2); color: #fff; font-weight: 600; }
  /* 右上角圆形头像 */
  button.avatar {
    width: 36px; height: 36px; border-radius: 50%; padding: 0;
    background: linear-gradient(180deg,#ff8a3d,#ff6a1a); border: 2px solid #ff9a52; color: #fff;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: .15s; line-height: 1;
    box-shadow: 0 4px 12px rgba(255,106,26,.35);
  }
  button.avatar:hover { filter: brightness(1.1); }
  button.avatar.logged { background: linear-gradient(180deg,#a055bd,#7d3a9e); border-color: #c07dd8; box-shadow: 0 4px 12px rgba(160,80,200,.35); }
  /* 顶栏放大的价格与涨跌率 */
  .top-price { display: flex; align-items: baseline; gap: 10px; margin-left: auto; padding-right: 4px; }
  .price-big { font-size: 24px; font-weight: 700; color: var(--txt); line-height: 1; font-variant-numeric: tabular-nums; }
  .chg-big { font-size: 17px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .info { color: var(--txt2); font-size: 12px; }
  .info b { color: var(--txt); }
  .up { color: var(--up); }
  .down { color: var(--down); }

  /* 主体 */
  .main { display: flex; flex: 1; min-height: 0; }
  .chart-wrap { flex: 1; position: relative; min-width: 0; }
  canvas#chart { display: block; width: 100%; height: 100%; background: var(--bg); cursor: grab; }
  canvas#chart.grabbing { cursor: grabbing; }
  canvas#chart.cross { cursor: crosshair; }
  /* 结算弹窗关闭后的浮动操作条 */
  .end-float {
    position: absolute; right: 14px; bottom: 14px; z-index: 6; display: none;
    gap: 8px; padding: 8px; background: rgba(16,18,22,.9); border: 1px solid var(--border);
    border-radius: 12px; backdrop-filter: blur(6px);
  }
  .end-float.show { display: flex; }
  .end-float .btn { padding: 8px 16px; font-size: 13px; }

  /* 右侧面板 */
  .side {
    width: 272px; padding: 12px; background: rgba(9,10,12,.6); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px; font-size: 13px; overflow-y: auto;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
  }
  .panel h3 { font-size: 12px; color: var(--txt3); margin-bottom: 8px; font-weight: 600; letter-spacing: 1px; }
  .row { display: flex; justify-content: space-between; padding: 3px 0; }
  .row .k { color: var(--txt2); }
  .row .v { color: var(--txt); font-variant-numeric: tabular-nums; }
  .ops { display: flex; flex-direction: column; gap: 8px; }
  .ops .btn { padding: 10px; font-size: 14px; border-radius: 10px; }
  /* 重点指标卡片 */
  .hero-stat { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
    background: var(--panel); border: 1px solid var(--border); position: relative; overflow: hidden; }
  .hero-stat::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background: var(--accent); }
  .hero-stat .hero-label { font-size: 12px; color: var(--txt3); margin-bottom: 4px; }
  .hero-stat .hero-val { font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .hero-stat .hero-sub { font-size: 11px; color: var(--txt3); margin-top: 3px; }
  .hero-toggle {
    width: 100%; background: none; border: none; color: var(--txt2); cursor: pointer;
    font-size: 12px; padding: 6px; font-family: inherit; border-radius: 8px;
  }
  .hero-toggle:hover { color: var(--txt); background: rgba(255,255,255,.04); }
  .hero-detail { display: none; }
  .hero-detail.open { display: block; }
  /* 操作点状态提示 */
  .phase-tag {
    text-align: center; font-size: 12px; font-weight: 700; padding: 7px; border-radius: 9px;
    margin-bottom: 8px; font-variant-numeric: tabular-nums;
  }
  .phase-tag.open { background: var(--accent-soft); color: var(--accent2); border: 1px solid rgba(255,106,26,.3); }
  .phase-tag.close { background: rgba(45,212,160,.12); color: #45e8bd; border: 1px solid rgba(45,212,160,.3); }

  /* 遮罩弹窗 */
  .mask {
    position: absolute; inset: 0; background: rgba(0,0,0,.72);
    display: none; align-items: center; justify-content: center; z-index: 10;
    backdrop-filter: blur(3px);
  }
  .mask.show { display: flex; }
  .dialog {
    position: relative;
    background: linear-gradient(180deg,#14161b,#0e1014); border: 1px solid var(--border);
    border-radius: 18px; padding: 26px 32px; min-width: 320px; text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,106,26,.06);
  }
  .dialog h2 { margin-bottom: 14px; font-size: 20px; }
  .dialog .big { font-size: 34px; font-weight: 800; margin: 10px 0; font-variant-numeric: tabular-nums; }
  .dialog .sub { color: var(--txt2); font-size: 13px; margin: 5px 0; }
  .dialog .btn { margin-top: 16px; padding: 10px 24px; font-size: 14px; border-radius: 10px; }
  /* 弹窗右上角关闭叉 */
  .dlg-x {
    position: absolute; top: 10px; right: 12px; width: 30px; height: 30px;
    border-radius: 50%; border: 1px solid var(--border); background: var(--panel2);
    color: var(--txt2); font-size: 16px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-family: inherit;
    transition: .15s;
  }
  .dlg-x:hover { background: rgba(255,90,90,.18); border-color: rgba(255,90,90,.4); color: #ff8080; }

  .hint { color: var(--txt3); font-size: 11px; line-height: 1.6; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }

  /* ========== 左侧导航栏（对局 / 大盘） ========== */
  .leftnav {
    width: 62px; flex: 0 0 62px; background: #0a0c0f;
    border-right: 1px solid rgba(255,255,255,.07);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 0; gap: 8px;
  }
  .nav-btn {
    width: 52px; padding: 10px 0; border: 1px solid transparent; border-radius: 10px;
    background: transparent; color: var(--txt3); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    font-size: 12px; font-family: inherit; transition: .15s; letter-spacing: 1px;
  }
  .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .nav-btn:hover { color: var(--txt); background: rgba(255,255,255,.05); }
  .nav-btn.active { color: var(--accent); background: rgba(255,106,26,.12); border-color: rgba(255,106,26,.35); }

  /* ========== 指标折叠面板 ========== */
  .ind-panel { margin-top: 10px; }
  .ind-box { display: none; padding: 8px 10px 10px; }
  .ind-box.show { display: block; }
  .ind-group { margin-bottom: 8px; }
  .ind-group:last-child { margin-bottom: 0; }
  .ind-group .ig-label { font-size: 11px; color: var(--txt3); margin-bottom: 5px; letter-spacing: 1px; }
  .ind-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .ind-chip {
    padding: 4px 10px; font-size: 12px; border-radius: 6px; cursor: pointer;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    color: var(--txt2); font-family: inherit; transition: .12s;
  }
  .ind-chip:hover { border-color: rgba(255,106,26,.4); color: var(--txt); }
  .ind-chip.on { background: rgba(255,106,26,.16); border-color: rgba(255,106,26,.5); color: var(--accent); }

  /* ========== 交易弹窗（自定义手数） ========== */
  .trade-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--txt2); padding: 3px 4px; }
  .trade-line b { color: var(--txt); font-weight: 600; }
  .lot-row { display: flex; align-items: center; gap: 8px; margin: 10px 4px 6px; }
  .lot-row input {
    flex: 1; width: 100%; padding: 9px 10px; font-size: 18px; font-weight: 700;
    background: #060708; border: 1px solid rgba(255,255,255,.15); color: var(--txt);
    border-radius: 8px; box-sizing: border-box; text-align: center;
  }
  .lot-row input:focus { border-color: var(--accent); outline: none; }
  .lot-row .lot-unit { color: var(--txt3); font-size: 13px; white-space: nowrap; }
  .trade-frac { display: flex; gap: 6px; margin: 4px 4px 10px; }
  .trade-frac .btn { flex: 1; padding: 7px 0; font-size: 13px; }

  /* ========== 大盘页统计条 ========== */
  .mkt-stats {
    position: absolute; top: 10px; left: 12px; right: 76px; z-index: 5;
    display: none; gap: 8px; flex-wrap: wrap; pointer-events: none;
  }
  .mkt-stats.show { display: flex; }
  .mkt-chip {
    background: rgba(10,12,15,.82); border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px; padding: 5px 11px; font-size: 12px; color: var(--txt2);
    backdrop-filter: blur(3px); white-space: nowrap;
  }
  .mkt-chip b { font-size: 14px; margin-left: 4px; }
  .mkt-chip .up { color: var(--up); } .mkt-chip .down { color: var(--down); }
  .mkt-loading {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: var(--txt3); font-size: 15px; z-index: 4; letter-spacing: 2px;
  }
  .mkt-loading.show { display: flex; }
</style>
</head>
<body>
<div id="app">
  <!-- 顶部：日K进度最左侧，右侧为放大价格+涨跌率 -->
  <div class="topbar">
    <div class="group">
      <span class="info">日K进度: <b id="dayProg">0/60</b></span>
    </div>
    <div class="group">
      <span class="label">周期</span>
      <button class="btn tf" data-tf="M">月</button>
      <button class="btn tf" data-tf="W">周</button>
      <button class="btn tf active" data-tf="D">日</button>
      <button class="btn tf" data-tf="240">4h</button>
      <button class="btn tf" data-tf="60">1h</button>
      <button class="btn tf" data-tf="30">30m</button>
      <button class="btn tf" data-tf="15">15m</button>
    </div>
    <div class="group">
      <span class="label">杠杆</span>
      <button class="btn lev active" data-lev="1">1x</button>
      <button class="btn lev" data-lev="5">5x</button>
      <button class="btn lev" data-lev="10">10x</button>
      <button class="btn lev" data-lev="20">20x</button>
    </div>
    <!-- 顶栏价格 + 涨跌率 -->
    <div class="top-price">
      <span class="price-big" id="curPrice">--</span>
      <span class="chg-big" id="dayChg">--</span>
    </div>
    <!-- 右上角头像：个人中心入口 -->
    <div class="group">
      <button class="avatar" id="avatarBtn">客</button>
    </div>
  </div>

  <!-- 主体 -->
  <div class="main">
    <!-- 左侧导航：对局 / 大盘 -->
    <nav class="leftnav">
      <button class="nav-btn active" id="navTrade" title="对局">
        <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8"/><path d="M18 6h3v3"/></svg>
        <span>对局</span>
      </button>
      <button class="nav-btn" id="navMarket" title="大盘">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
        <span>大盘</span>
      </button>
    </nav>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <!-- 大盘页：顶部统计条 -->
      <div class="mkt-stats" id="mktStats"></div>
      <div class="mkt-loading" id="mktLoading">大盘行情加载中…</div>
      <!-- 结算弹窗被X关闭后，右下角浮动操作条 -->
      <div class="end-float" id="endFloat">
        <button class="btn long" id="floatAgain">再来一局</button>
        <button class="btn" id="floatReplay">重玩上局</button>
        <button class="btn" id="floatReview">复盘</button>
      </div>
      <!-- 开局弹窗被X关闭后，右下角浮动开始条 -->
      <div class="end-float" id="startFloat">
        <button class="btn next" id="floatStart">开始交易</button>
        <button class="btn" id="floatCenter">个人中心</button>
      </div>
      <!-- 拖动回看历史时，底部居中"回到最新"按钮 -->
      <button class="btn next" id="toLatest"
        style="display:none;position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;padding:8px 20px;font-size:13px;letter-spacing:1px;">回到最新 →</button>
      <!-- 开局弹窗 -->
      <div class="mask show" id="startMask">
        <div class="dialog">
          <button class="dlg-x" id="startX">×</button>
          <h2>模拟股票交易</h2>
          <div class="sub" id="dataStatus">正在后台筛选A股真实行情…</div>
          <div style="display:flex;justify-content:center;gap:10px;margin-top:6px;">
            <button class="btn next" id="startBtn" disabled>开始交易</button>
            <button class="btn" id="retryBtn" style="display:none;">重试加载</button>
            <button class="btn" id="centerBtn">个人中心</button>
          </div>
        </div>
      </div>
      <div class="mask" id="mask">
        <div class="dialog">
          <button class="dlg-x" id="endX" title="关闭（可点右下角浮动条或按R键重开）">×</button>
          <h2 id="dlgTitle">本局结算</h2>
          <div class="big" id="dlgRet">--</div>
          <div class="sub" id="dlgStock" style="font-size:16px;font-weight:700;color:#e6e9f0;"></div>
          <div class="sub" id="dlgRange"></div>
          <div class="sub" id="dlgMkt"></div>
          <div class="sub" id="dlgCmp" style="font-weight:600;"></div>
          <div class="sub" id="dlgSub"></div>
          <div class="sub" id="dlgSub2"></div>
          <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;">
            <button class="btn next" id="againBtn">再来一局</button>
            <button class="btn" id="replayBtn">重玩上局</button>
            <button class="btn" id="reviewBtn">复盘</button>
            <button class="btn" id="archiveBtn">存档</button>
          </div>
        </div>
      </div>
      <!-- 通用小提示弹窗（单按钮确定） -->
      <div class="mask" id="tipMask">
        <div class="dialog" style="min-width:300px;">
          <button class="dlg-x" id="tipX">×</button>
          <h2 id="tipTitle" style="font-size:17px;">提示</h2>
          <div class="sub" id="tipMsg" style="font-size:14px;line-height:1.6;padding:4px 6px;"></div>
          <button class="btn next" id="tipOk">确定</button>
        </div>
      </div>
      <!-- 交易弹窗：自定义手数（1手=100股）+ 快捷仓位 -->
      <div class="mask" id="tradeMask">
        <div class="dialog" style="min-width:340px;">
          <button class="dlg-x" id="tradeX">×</button>
          <h2 id="tradeTitle" style="color:var(--accent);">买入</h2>
          <div class="trade-line"><span>当前价格</span><b id="tradePrice">--</b></div>
          <div class="trade-line"><span id="tradeAvailLabel">可用资金</span><b id="tradeAvail">--</b></div>
          <div class="trade-line"><span id="tradeMaxLabel">最多可买</span><b id="tradeMax">--</b></div>
          <div class="lot-row">
            <input id="lotInput" type="number" min="1" step="1" placeholder="手数">
            <span class="lot-unit">手（100股/手）</span>
          </div>
          <div class="trade-frac">
            <button class="btn pos" data-tfrac="0.25">1/4</button>
            <button class="btn pos" data-tfrac="0.333333">1/3</button>
            <button class="btn pos" data-tfrac="0.5">1/2</button>
            <button class="btn pos" data-tfrac="1">全仓</button>
          </div>
          <div style="display:flex;gap:10px;justify-content:center;margin-top:6px;">
            <button class="btn long" id="tradeOk">确认买入</button>
            <button class="btn" id="tradeCancel">取消</button>
          </div>
        </div>
      </div>
      <!-- 复盘弹窗 -->
      <div class="mask" id="reviewMask">
        <div class="dialog" style="min-width:760px;max-width:94vw;max-height:94vh;overflow-y:auto;">
          <button class="dlg-x" id="rvX">×</button>
          <h2 id="rvTitle">复盘</h2>
          <div class="sub" id="rvStock" style="font-size:15px;font-weight:700;color:#e6e9f0;"></div>
          <div class="sub" id="rvRange"></div>
          <div class="sub" id="rvMkt"></div>
          <div class="sub" id="rvResult"></div>
          <canvas id="reviewChart" width="900" height="360" style="background:#060708;border:1px solid rgba(255,255,255,.1);border-radius:10px;display:block;margin:6px auto;max-width:100%;"></canvas>
          <div id="rvTable" style="max-height:160px;overflow:auto;font-size:12px;margin-top:4px;"></div>
          <div style="display:flex;gap:10px;justify-content:center;margin-top:8px;">
            <button class="btn next" id="rvBack">返回</button>
          </div>
        </div>
      </div>
      <!-- 个人中心弹窗 -->
      <div class="mask" id="centerMask">
        <div class="dialog" style="min-width:440px;max-width:92vw;max-height:92vh;overflow-y:auto;">

<script>
"use strict";

/* ===================== 配置 ===================== */
const CFG = {
  startPrice: 100,        // 起始价
  initCash: 1000000,      // 初始资金 100万
  histDayBars: 100,       // 历史日K根数
  settleDayBars: 60,      // 结算日K根数
  feeRate: 0.001,         // 手续费 0.1%
  slipRate: 0.001,        // 滑点 0.1%
  liqRatio: 0.5,          // 维持保证金率 50%
  tfs: { M:2016, W:480, D:96, '240':16, '60':4, '30':2, '15':1 }, // 周期→tick数
  dayTicks: 96,           // 一日tick数
  maPeriods: [5,10,20],   // 均线周期
};

/* ===================== 状态 ===================== */
let G = null; // 全局游戏状态

/* ===================== 真实行情（东方财富免费API · JSONP跨域） ===================== */
const EM_LIST_TTL = 7*24*3600*1000;   // 股票列表缓存7天
const EM_LIST_KEY = 'em_stocklist_v2';   // v2：含 f2 最新价，供资金预过滤

/* ===================== 个人中心 / 历史记录（localStorage） ===================== */
const SG_HIST_KEY = 'sg_history_v1';        // {recent:[最多20条], archived:[最多100条]}
const SG_SETTINGS_KEY = 'sg_settings_v1';   // {initCash, mode:'guest'|'login', user, code}
const RECENT_CAP = 20;                       // 最近记录上限（FIFO轮转）
const ARCHIVE_CAP = 100;                      // 存档上限

function loadSettings(){
  try{ return JSON.parse(localStorage.getItem(SG_SETTINGS_KEY)) ||
    {initCash: CFG.initCash, mode:'guest', user:'', code:''}; }
  catch(e){ return {initCash: CFG.initCash, mode:'guest', user:'', code:''}; }
}
function saveSettings(s){
  try{ localStorage.setItem(SG_SETTINGS_KEY, JSON.stringify(s)); }catch(e){}
}
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(SG_HIST_KEY)) || {recent:[], archived:[]}; }
  catch(e){ return {recent:[], archived:[]}; }
}
function saveHistory(h){
  try{ localStorage.setItem(SG_HIST_KEY, JSON.stringify(h)); }
  catch(e){ showTip('存储已满，请清理已存档记录'); }
}
function pushRecent(snap){
  const h = loadHistory();
  h.recent.push(snap);
  while(h.recent.length > RECENT_CAP) h.recent.shift();   // FIFO 丢弃最旧
  saveHistory(h);
}
function archiveGame(id){
  const h = loadHistory();
  const i = h.recent.findIndex(s => s.id === id);
  if(i >= 0){ h.archived.push(h.recent[i]); h.recent.splice(i,1); }
  while(h.archived.length > ARCHIVE_CAP) h.archived.shift();
  saveHistory(h);
}
function deleteGame(id){
  const h = loadHistory();
  h.archived = h.archived.filter(s => s.id !== id);
  h.recent = h.recent.filter(s => s.id !== id);
  saveHistory(h);
}
function findSnap(id){
  const h = loadHistory();
  return h.recent.find(s => s.id === id) || h.archived.find(s => s.id === id) || null;
}

/* 构建本局快照（结算时调用），紧凑格式：日K数组+日期+交易记录 */
function buildSnapshot(){
  const settings = loadSettings();
  const daily = G.real ? G.real.daily : [];
  const dates = G.real ? G.real.daily.map(b => b.date) : [];
  const snap = {
    id: 'g_' + Date.now(),
    ts: Date.now(),
    initCash: G.initCash,
    mode: settings.mode,
    user: settings.user,
    ret: 0, win: G.win || false, reason: '', total: G.cash,
    tradeCount: G.tradeCount, lev: G.lev,
    real: G.real ? {
      code: G.real.code, name: G.real.name,
      marketType: G.real.marketType, marketRet: G.real.marketRet,
      startDate: G.real.tradeDays[0].date, endDate: G.real.tradeDays[G.real.tradeDays.length-1].date
    } : null,
    sim: G.real ? null : {startDate: '', endDate: '', marketType: '', marketRet: 0},
    daily: daily.map(b => [b.o, b.h, b.l, b.c, b.v]),
    dates: dates,
    tradeDay0: G.tradeDay0,
    trades: G.trades.map(t => ({dir: t.dir, tick: t.tick, price: t.price, qty: t.qty, pnl: t.pnl}))
  };
  return snap;
}

/* JSONP：借助 <script> 标签绕过浏览器跨域限制（支持自定义回调参数名）。
   兼容两种回调风格：调用式 cb({data}) 与赋值式 cb={data}（腾讯 _var 为赋值式） */
function jsonp(url, opts){
  opts = opts || {};
  const timeout = opts.timeout || 8000;
  const param = opts.param || 'cb';
  return new Promise((resolve, reject)=>{
    const cb = 'jp_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    const s = document.createElement('script');
    let settled = false;
    const cleanup = ()=>{
      try{ clearTimeout(timer); }catch(e){}
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
    };
    const finish = (ok, data)=>{
      if(settled) return;
      settled = true; cleanup();
      ok ? resolve(data) : reject(new Error(data || '加载失败'));
    };
    const timer = setTimeout(()=> finish(false, '请求超时'), timeout);
    const callFn = (data)=> finish(true, data);
    try{
      Object.defineProperty(window, cb, {
        configurable: true,
        get: function(){ return callFn; },          // 调用式：返回接收数据的函数
        set: function(v){ finish(true, v); }        // 赋值式：直接收到数据对象
      });
    }catch(e){ window[cb] = callFn; }
    s.onerror = ()=> finish(false, '网络错误');
    s.src = url + (url.indexOf('?')>=0 ? '&' : '?') + param + '=' + cb;
    document.head.appendChild(s);
  });
}

/* 多主机竞速（任一成功即返回） */
function jsonpRace(paths, hosts, opts){
  hosts = hosts || ['https://push2delay.eastmoney.com', 'https://push2.eastmoney.com'];
  return new Promise((resolve, reject)=>{
    let pending = hosts.length, done = false;
    let firstErr = null;
    hosts.forEach(h=>{
      jsonp(h + paths, opts).then(d=>{ if(!done){ done = true; resolve(d); } })
        .catch(e=>{ if(!firstErr) firstErr = e; if(--pending === 0 && !done) reject(firstErr); });
    });
  });
}

/* 多任务竞速：取第一个非空(non-null)结果 */
function firstNonNull(ps){
  return new Promise((resolve, reject)=>{
    let pending = ps.length, done = false;
    const fail = ()=>{ if(--pending === 0 && !done){ done = true; reject(new Error('无有效数据')); } };
    ps.forEach(p=> p.then(v=>{
      if(v && !done){ done = true; resolve(v); } else if(!v) fail();
    }).catch(fail));
  });
}

/* 受限并发执行：n路worker依次消费任务，避免突发并发触发接口限流 */
async function pooled(n, tasks){
  const ret = new Array(tasks.length);
  let i = 0;
  async function worker(){
    while(i < tasks.length){
      const idx = i++;
      try{ ret[idx] = await tasks[idx](); }catch(e){ ret[idx] = null; }
    }
  }
  await Promise.all(Array.from({length: Math.max(1, Math.min(n, tasks.length))}, worker));
  return ret;
}

/* 全量A股列表（沪深主板+创业板+科创板，剔除ST/退市/上市初期新股），localStorage缓存7天 */
async function fetchStockList(){
  try{
    const c = JSON.parse(localStorage.getItem(EM_LIST_KEY) || 'null');
    if(c && c.list && c.list.length > 100 && Date.now() - c.t < EM_LIST_TTL) return c.list;
  }catch(e){}
  const fs = 'm:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23';
  // f2=最新价（用于按资金预过滤“买得起1手”的股票）
  const q = '/api/qt/clist/get?po=0&np=1&fltt=2&invt=2&fid=f12&fs=' + fs + '&fields=f2,f12,f13,f14';
  // 先取第一页拿到总数，再受限并发（6路）拉取其余页（服务端每页上限100条）
  const first = await jsonpRace(q + '&pn=1&pz=100');
  const total = first && first.data ? first.data.total : 0;
  const diff1 = first && first.data ? first.data.diff : null;
  if(!diff1) throw new Error('列表接口无数据');
  const arr1 = Array.isArray(diff1) ? diff1 : Object.keys(diff1).map(k=>diff1[k]);
  const pages = Math.ceil(total / 100);
  const rest = await pooled(6, Array.from({length: Math.max(0, pages-1)},
    (_,i)=> ()=> jsonpRace(q + '&pn=' + (i+2) + '&pz=100')));
  const list = [];
  const push = (arr)=>{
    for(const it of arr || []){
      const code = it.f12, mkt = it.f13, name = it.f14;
      if(!code || !name) continue;
      if(/ST|退/.test(name)) continue;   // 剔除 ST / 退市整理
      if(/^[NC]/.test(name)) continue;   // 剔除上市初期新股（N首日 / C前5日）
      // f2 最新价（停牌股为 '-'，置 null 表示未知、不参与预过滤拦截）
      const price = (typeof it.f2 === 'number' && it.f2 > 0) ? it.f2 : null;
      list.push({code: String(code), mkt: mkt, name: String(name).replace(/\s+/g,''), price: price});
    }
  };
  push(arr1);
  for(const d of rest){ if(d && d.data && d.data.diff) push(Array.isArray(d.data.diff) ? d.data.diff : Object.keys(d.data.diff).map(k=>d.data.diff[k])); }
  if(list.length <= 100) throw new Error('股票列表拉取失败');
  try{ localStorage.setItem(EM_LIST_KEY, JSON.stringify({t: Date.now(), list: list})); }catch(e){}
  return list;
}

/* K线双数据源：
   1) 东方财富 push2his（前复权，字段序：date,open,close,high,low,volume,amount）
   2) 腾讯 ifzq（qfq前复权，字段序：date,open,close,high,low,volume）
   竞速取先返回有效数据者（push2delay 主机虽通但不返回K线数据，故K线不用它） */
function parseBarsEM(kl){
  const bars = [];
  for(const line of kl){
    const a = line.split(',');
    const b = {date: a[0], o: +a[1], c: +a[2], h: +a[3], l: +a[4], v: +a[5] || 0};
    if(b.o > 0 && b.c > 0 && b.h >= b.l && b.l > 0) bars.push(b);
  }
  return bars.length ? bars : null;
}
async function fetchDailyKlineEM(secid){
  const path = '/api/qt/stock/kline/get?secid=' + secid
    + '&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57'
    + '&klt=101&fqt=1&lmt=800&end=20500101';
  const d = await jsonp('https://push2his.eastmoney.com' + path, {timeout: 7000});
  const kl = d && d.data && d.data.klines;
  return (kl && kl.length) ? parseBarsEM(kl) : null;
}
async function fetchDailyKlineTX(code, mkt){
  const symbol = (mkt === 1 ? 'sh' : 'sz') + code;
  const url = 'https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=' + symbol + ',day,,,800,qfq';
  const d = await jsonp(url, {timeout: 7000, param: '_var'});
  const node = d && d.data && d.data[symbol];
  if(!node) return null;
  const arr = node.qfqday || node.day;
  if(!arr || !arr.length) return null;
  const bars = [];
  for(const r of arr){
    if(!r || r.length < 6) continue;
    const b = {date: r[0], o: +r[1], c: +r[2], h: +r[3], l: +r[4], v: +r[5] || 0};
    if(b.o > 0 && b.c > 0 && b.h >= b.l && b.l > 0) bars.push(b);
  }
  return bars.length ? bars : null;
}
async function fetchDailyKline(secid, code, mkt){
  return firstNonNull([
    fetchDailyKlineEM(secid),
    fetchDailyKlineTX(code, mkt),
  ]);
}

/* ===== 大盘数据：大盘指数 + 所属板块指数（不显示板块名）+ 涨跌家数/涨跌停 ===== */
const EM_BOARD_LIST_KEY = 'sg_em_boards_v1';
let boardListCache = null;

/* 行业板块列表（f12=BK代码, f14=板块名），缓存7天 */
async function fetchBoardList(){
  if(boardListCache) return boardListCache;
  try{
    const c = JSON.parse(localStorage.getItem(EM_BOARD_LIST_KEY) || 'null');
    if(c && c.list && c.list.length > 30 && Date.now() - c.t < 7*864e5) { boardListCache = c.list; return c.list; }
  }catch(e){}
  const q = '/api/qt/clist/get?pn=1&pz=200&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:90+t:2&fields=f12,f14';
  const d = await jsonp('https://push2.eastmoney.com' + q, {timeout: 7000});
  const diff = d && d.data && d.data.diff;
  if(!diff) throw new Error('板块列表无数据');
  const arr = Array.isArray(diff) ? diff : Object.keys(diff).map(k=>diff[k]);
  const list = arr.map(it => ({code: String(it.f12), name: String(it.f14||'').replace(/\s+/g,'')})).filter(b=>b.code && b.name);
  if(list.length < 30) throw new Error('板块列表过少');
  boardListCache = list;
  try{ localStorage.setItem(EM_BOARD_LIST_KEY, JSON.stringify({t: Date.now(), list})); }catch(e){}
  return list;
}

/* 后台拉取本局对应的大盘/板块数据，失败静默（大盘页显示加载失败） */
async function kickFetchMarket(r){
  const code = r.pick.code;
  const idxSecid = code[0] === '6' ? '1.000001' : '0.399001';
  const idxName = code[0] === '6' ? '上证指数' : '深证成指';
  const mk = { ready:false, failed:false, idxName, idxBars:null, boardBars:null,
               idxLast:null, idxChg:0, up:0, down:0, ping:0, zt:0, dt:0, sim:false };
  G.mkt = mk;
  try{
    // 1) 大盘指数日K（全历史，东财+腾讯双源竞速）
    const ix = idxSecid.split('.');
    mk.idxBars = await fetchDailyKline(idxSecid, ix[1], Number(ix[0]));
    if(!mk.idxBars) throw new Error('指数K线失败');
    // 2) 板块代码：股票 f127=行业板块名 → 板块列表反查 BK 代码 → 板块日K（secid=90.BKxxxx，不显示板块名）
    try{
      const q0 = await jsonp('https://push2.eastmoney.com/api/qt/stock/get?secid=' + r.pick.mkt + '.' + code
        + '&fields=f127&fltt=2', {timeout: 6000});
      const bName = q0 && q0.data && q0.data.f127 ? String(q0.data.f127).replace(/\s+/g,'') : null;
      if(bName){
        const boards = await fetchBoardList();
        const bk = boards.find(b => b.name === bName || b.name.indexOf(bName) >= 0 || bName.indexOf(b.name) >= 0);
        if(bk) mk.boardBars = await fetchDailyKlineEM('90.' + bk.code);
      }
    }catch(e){ /* 板块缺失不阻塞大盘页 */ }
    // 3) 当日涨跌家数（指数快照 f104/f105/f106）
    try{
      const q1 = await jsonp('https://push2.eastmoney.com/api/qt/ulist.np/get?secids=' + idxSecid
        + '&fields=f43,f104,f105,f106,f170&fltt=2', {timeout: 6000});
      const diff = q1 && q1.data && q1.data.diff;
      const row = Array.isArray(diff) ? diff[0] : diff ? diff[Object.keys(diff)[0]] : null;
      if(row){
        mk.up = row.f104 || 0; mk.down = row.f105 || 0; mk.ping = row.f106 || 0;
        mk.idxLast = row.f43; mk.idxChg = row.f170 || 0;
      }
    }catch(e){}
    // 4) 当日涨停/跌停数量（涨跌停池 tc）
    const today = mk.idxBars[mk.idxBars.length-1].date.replace(/-/g,'');
    try{
      const pool = async (host) => {
        const d = await jsonp('https://push2ex.eastmoney.com/getTopic' + host + 'Pool?ut=7eea3edcaed734bea9cbfc24409ed989&dpt=wz.ztzt&Pageindex=0&pagesize=1&sort=fbt:asc&date=' + today, {timeout: 6000});
        return d && d.data ? (d.data.tc || 0) : 0;
      };
      const [zt, dt] = await Promise.all([pool('ZT'), pool('DT')]);
      mk.zt = zt; mk.dt = dt;
    }catch(e){}
    mk.ready = true;
  }catch(e){
    // 大盘真实数据完全失败时，回退合成指数（标注模拟数据），保证页面可用
    try{ synthMarketData(); }catch(_){ mk.failed = true; }
  }
  if(G && G.page === 'market') draw();
}

/* 模拟行情下：由个股日K合成相关的大盘/板块指数（低β相关 + 噪声），家数/涨跌停按涨跌日推演 */
function synthMarketData(){
  const daily = G.real ? G.real.daily : agg('D', G.tickOHLC.length-1);
  const mk = { ready:true, failed:false, sim:true, idxName:'大盘指数', idxBars:null, boardBars:null,
               idxLast:null, idxChg:0, up:0, down:0, ping:0, zt:0, dt:0 };
  const synth = (base, beta, noise, startV, volScale) => {
    const out = []; let v = startV;
    for(let i=0;i<daily.length;i++){
      const d = daily[i];
      const ret = (d.c/d.o - 1);
      const r = ret*beta + (Math.random()-0.5)*noise;
      const o = v, c = v*(1+r);
      const h = Math.max(o,c)*(1+Math.random()*noise*0.4), l = Math.min(o,c)*(1-Math.random()*noise*0.4);
      out.push({date:d.date, o, c, h, l, v: Math.round(d.v*volScale*(0.7+Math.random()*0.6))});
      v = c;
    }
    return out;
  };
  mk.idxBars = synth(daily, 0.35, 0.012, 3200, 200);
  mk.boardBars = synth(daily, 0.7, 0.016, 1200, 40);
  const last = mk.idxBars[mk.idxBars.length-1];
  mk.idxLast = last.c; mk.idxChg = (last.c/last.o-1)*100;
  const upDay = last.c >= last.o;
  mk.up = upDay ? 1800 + Math.round(Math.random()*1200) : 600 + Math.round(Math.random()*800);
  mk.down = upDay ? 600 + Math.round(Math.random()*800) : 1800 + Math.round(Math.random()*1200);
  mk.ping = 80 + Math.round(Math.random()*120);
  mk.zt = upDay ? 40 + Math.round(Math.random()*60) : 5 + Math.round(Math.random()*20);
  mk.dt = upDay ? 3 + Math.round(Math.random()*15) : 20 + Math.round(Math.random()*60);
  G.mkt = mk;
}

/* ===== 后台筛选系统：按资金在后台预选“买得起1手”的股票，用户点开始即玩 =====
   - 页面加载/资金变更/每局开始时，后台自动筛选并预取K线
   - 筛选条件：1手(100股)×单价 ≤ 初始资金（先用列表最新价 f2 粗滤，再用K线窗口开盘价验证）
   - 用户点“开始交易”时直接取用已就绪的结果，无需等待加载 */
let pickGen = 0;          // 筛选代次：资金变更/重开时递增，作废旧结果
let readyMarket = null;   // 已就绪的行情 {cap, pick, bars, startIdx}
let readyPromise = null;  // 进行中的筛选 Promise
let readyCap = 0;         // 进行中筛选对应的资金

function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 后台筛选一只符合资金条件的A股并预取完整K线 */
async function backgroundPick(cap, gen){
  const list = await fetchStockList();
  if(gen !== pickGen) return null;
  // 第一步（粗滤）：列表最新价 ×100 ≤ 资金 才进入候选；无价格字段的旧缓存不拦截
  let cands = list.filter(s => (!s.price || s.price <= 0) ? true : s.price * 100 <= cap);
  if(cands.length < 20) cands = list.slice();   // 极端资金下候选过少，则全量交给K线验证
  shuffleArr(cands);
  // 第二步（验证）：4路并发拉K线，每只股票试3个随机窗口，取窗口开盘价买得起的
  let tried = 0;
  for(let i=0; i<cands.length && tried < 30 && gen === pickGen; ){
    const batch = [];
    for(let k=0; k<4 && i<cands.length && tried < 30; k++, i++){ batch.push(cands[i]); tried++; }
    const rs = await pooled(4, batch.map(p => async ()=>{
      try{ return {p: p, bars: await fetchDailyKline(p.mkt + '.' + p.code, p.code, p.mkt)}; }
      catch(e){ return {p: p, bars: null}; }
    }));
    for(const r of rs){
      if(gen !== pickGen) return null;
      const bars = r && r.bars;
      if(!bars || bars.length < 170) continue;
      for(let w=0; w<3; w++){
        const startIdx = 100 + Math.floor(Math.random() * (bars.length - 160));
        if(bars[startIdx].o * 100 <= cap){
          return {cap: cap, pick: r.p, bars: bars, startIdx: startIdx};
        }
      }
    }
  }
  throw new Error('未筛选到符合资金条件的股票');
}

/* 开始界面状态文案 + 按钮。
   按钮可用性只取决于“当前这局”是否就绪（!G.loading）；
   后台预筛下一局进行中不应阻塞当前局开始。 */
function updateStartStatus(err){
  const cap = loadSettings().initCash || CFG.initCash;
  const st = document.getElementById('dataStatus');
  const btn = document.getElementById('startBtn');
  const currentReady = G && !G.loading;   // 当前局行情是否已就绪可开玩
  if(readyMarket && readyMarket.cap === cap){
    st.textContent = '行情已就绪';
    btn.disabled = false;
    btn.textContent = '开始交易';
  }else if(currentReady){
    st.textContent = '行情已就绪';
    btn.disabled = false;
    btn.textContent = '开始交易';
  }else if(err){
    st.textContent = '行情加载失败，将使用模拟行情';
    btn.disabled = false;
    btn.textContent = '开始交易';
  }else{
    st.textContent = '行情加载中…';
    btn.disabled = true;
    btn.textContent = '筛选中…';
  }
}

/* 触发一轮后台筛选（页面加载 / 资金变更 / 每局用掉预选结果后调用） */
function kickBackgroundPick(){
  const cap = loadSettings().initCash || CFG.initCash;
  pickGen++;
  readyMarket = null;
  readyCap = cap;
  updateStartStatus();
  const gen = pickGen;
  readyPromise = backgroundPick(cap, gen).then(r=>{
    if(gen === pickGen && r) readyMarket = r;
    readyPromise = null;
    updateStartStatus();
    return (gen === pickGen && r) ? r : null;
  }).catch(err=>{
    if(gen === pickGen){ readyPromise = null; updateStartStatus(err); }
    return null;
  });
  return readyPromise;
}

/* 确保拿到一只符合当前资金的行情：已就绪立即返回，否则等待后台筛选 */
async function ensureMarket(cap){
  if(readyMarket && readyMarket.cap === cap) return readyMarket;
  if(readyPromise && readyCap === cap){
    await readyPromise;
    if(readyMarket && readyMarket.cap === cap) return readyMarket;
    return null;
  }
  return await kickBackgroundPick();
}

/* 行情分类：股灾 / 妖股 / 冲高回落 / 趋势上涨 / 趋势下跌 / 横盘（按交易日序列） */
function classifyMarket(days){
  const chg = days[days.length-1].c / days[0].o - 1;   // 区间涨跌幅
  let hi = -Infinity, lo = Infinity, peak = days[0].c;
  for(const b of days){
    if(b.h > hi) hi = b.h;
    if(b.l < lo) lo = b.l;
    if(b.c > peak) peak = b.c;
  }
  const range = (hi - lo) / lo;                        // 区间振幅
  const maxGain = peak / days[0].o - 1;                // 期间最大涨幅
  let dd = 0, pk = days[0].c, mdd = 0;                 // 最大回撤（按收盘）
  for(const b of days){
    if(b.c > pk) pk = b.c;
    dd = (pk - b.c) / pk;
    if(dd > mdd) mdd = dd;
  }
  if(chg <= -0.20) return '股灾';
  if(range >= 0.50) return '妖股';
  if(maxGain >= 0.20 && chg < 0.10) return '冲高回落';
  if(chg >= 0.15) return '趋势上涨';
  if(chg <= -0.10) return '趋势下跌';
  return '横盘';
}

/* 真实日K → 每日96个15分钟tick：日内路径=线性插值+布朗桥噪声，拉伸至触及当日最高/最低，
   保证按日聚合后 开/高/低/收 与真实日K完全一致 */
function realBarsToTicks(daily){
  const n = CFG.dayTicks, ticks = [];
  for(const b of daily){
    const path = new Array(n+1);
    path[0] = b.o; path[n] = b.c;
    if(b.h - b.l < 1e-9){
      for(let i=1; i<n; i++) path[i] = b.o;            // 一字板
    }else{
      const L = i => b.o + (b.c - b.o) * i / n;
      const w = new Array(n+1).fill(0);
      let acc = 0;
      for(let i=1; i<n; i++){ acc += (Math.random()-0.5)*2; w[i] = acc; }
      const wEnd = w[n-1];
      for(let i=1; i<n; i++) w[i] -= wEnd * i / n;     // 布朗桥：首尾归零
      let maxd = 1e-12, mind = -1e-12, iMax = 1, iMin = 1;
      for(let i=1; i<n; i++){
        if(w[i] > maxd){ maxd = w[i]; iMax = i; }
        if(w[i] < mind){ mind = w[i]; iMin = i; }
      }
      const maxL = Math.max(b.o, b.c), minL = Math.min(b.o, b.c);
      const sHi = (b.h - maxL) / maxd;
      const sLo = (minL - b.l) / (-mind);
      let s = Math.min(sHi, sLo);
      s = Math.max(0.05, Math.min(s, 4));              // 限制拉伸幅度，避免失真
      for(let i=1; i<n; i++){
        let p = L(i) + s * w[i];
        if(p > b.h) p = b.h;
        if(p < b.l) p = b.l;
        path[i] = p;
      }
      path[iMax] = b.h; path[iMin] = b.l;              // 确保触及当日最高/最低
    }
    path[0] = b.o; path[n] = b.c;
    // 日成交量按 U 型分布到 tick（开盘/收盘密集，贴近A股分时特征）
    const vw = []; let vsum = 0;
    for(let i=1; i<=n; i++){
      const t = i / n;
      const wt = 1 + 1.2 * Math.pow(2 * Math.min(t, 1-t), 2) + Math.random() * 0.5;
      vw.push(wt); vsum += wt;
    }
    for(let i=1; i<=n; i++){
      const o = path[i-1], c = path[i];
      ticks.push({o: o, c: c, h: Math.max(o,c), l: Math.min(o,c),
                  v: Math.max(1, Math.round(b.v * vw[i-1] / vsum))});
    }
  }
  return ticks;
}

let lastMarketData = null;
function newReplay(){

  hideTip();
  document.getElementById('mask').classList.remove('show');

  setPage('trade');

/* ===================== 行情生成 ===================== */
let lastPrice = CFG.startPrice;
function genTicks(n){
  if(G && G.real) return;   // 真实行情模式：tick已在开局一次性生成，禁止追加模拟数据
  for(let i=0;i<n;i++){
    // 随机游走，含轻drift与波动率簇
    const vol = 0.006 + Math.random()*0.006;   // 0.6%~1.2% 每tick波动
    const drift = (Math.random()-0.5)*0.001;
    const o = lastPrice;
    let c = o * (1 + drift + (Math.random()-0.5)*2*vol);
    if(c < 0.5) c = 0.5;
    let h = Math.max(o, c) * (1 + Math.random()*vol*0.6);
    let l = Math.min(o, c) * (1 - Math.random()*vol*0.6);
    const v = Math.round(500 + Math.random()*4500);
    G.tickOHLC.push({o,h,l,c,v});
    lastPrice = c;
  }
}

/* 聚合：给定周期与结束tick索引，返回该周期K线数组（用于绘图，取最近N根） */
function agg(tf, endIdx){
  const step = CFG.tfs[tf];
  // 周期K线 b 覆盖 tick [b*step, b*step+step-1]；只聚合到 endIdx（未发生的tick不显示）
  const bars = [];
  const totalBars = Math.floor((endIdx+1)/step);   // 完整K线数
  for(let b=0; b<totalBars; b++){
    const s = b*step, e = s+step-1;
    const t0 = G.tickOHLC[s];
    let o=t0.o, h=t0.h, l=t0.l, c=G.tickOHLC[e].c, v=0;
    for(let k=s;k<=e;k++){
      const t=G.tickOHLC[k];
      if(t.h>h) h=t.h;
      if(t.l<l) l=t.l;
      v+=t.v;
    }
    bars.push({o,h,l,c,v, idx:b, sTick:s, eTick:e, partial:false,
               date: (G.real && G.real.daily[Math.floor(e/CFG.dayTicks)]) ? G.real.daily[Math.floor(e/CFG.dayTicks)].date : null});
  }
  // 正在形成的K线（当前周期尚未走完）：只含已发生的tick，实时变化
  const rem = (endIdx+1) % step;
  if(rem > 0){
    const b = totalBars, s = b*step, e = endIdx;
    const t0 = G.tickOHLC[s];
    let o=t0.o, h=t0.h, l=t0.l, c=G.tickOHLC[e].c, v=0;
    for(let k=s;k<=e;k++){
      const t=G.tickOHLC[k];
      if(t.h>h) h=t.h;
      if(t.l<l) l=t.l;
      v+=t.v;
    }
    bars.push({o,h,l,c,v, idx:b, sTick:s, eTick:e, partial:true,
               date: (G.real && G.real.daily[Math.floor(e/CFG.dayTicks)]) ? G.real.daily[Math.floor(e/CFG.dayTicks)].date : null});
  }
  // 开盘点：当日只有开盘价已知，正在形成的K线（任何周期）强制为单根开盘价，
  // 不泄漏当日后续走势（tick数据已预生成但不得提前显示）
  if(G && G.started && !G.over && G.phase === 'open' && bars.length){
    const openPx = G.tickOHLC[endIdx].o;
    const lb = bars[bars.length-1];
    lb.o = lb.h = lb.l = lb.c = openPx; lb.v = 0; lb.partial = true;
  }
  return bars;
}

/* 当前最新价 */
/* ===================== T+1 双操作点玩法 =====================
   每根日K两个操作点：
   - 开盘点(phase='open')：成交价=当日开盘价，curTickIdx=当日第1根tick
   - 收盘点(phase='close')：成交价=当日收盘价，curTickIdx=当日最后1根tick
   持仓按买入日分桶 lots[]，仅 lot.bar < curBar 的批次可卖（严格T+1，FIFO） */
function curPrice(){
  if(!G.started) return G.tickOHLC[G.curTickIdx].c;   // 开局前显示历史末价
  // 开盘点取该tick的o（=当日开盘价），收盘点取c（=当日收盘价）
  return G.phase === 'open' ? G.tickOHLC[G.curTickIdx].o : G.tickOHLC[G.curTickIdx].c;
}

/* T+1：可卖数量 = 买入日早于当前日的批次之和 */
function sellableQty(){
  return G.lots.reduce((s,l)=> s + (l.bar < G.curBar ? l.qty : 0), 0);
}

/* ===================== 推进 ===================== */
function stepNext(){
  if(!G.started || G.over) return;
  const base = (G.tradeDay0 + G.curBar) * CFG.dayTicks;
  if(G.phase === 'open'){
    // 开盘点 → 收盘点：揭示当日完整日K
    G.phase = 'close';
    G.curTickIdx = base + CFG.dayTicks - 1;
    checkLiquidation();                          // 以收盘价检查爆仓
  }else{
    // 收盘点 → 下一根日K的开盘点
    G.curBar++;
    if(G.curBar >= CFG.settleDayBars){ settle('60根日K已走完'); return; }
    G.phase = 'open';
    G.curTickIdx = (G.tradeDay0 + G.curBar) * CFG.dayTicks;
  }
  const need = G.curTickIdx + 1;                 // 模拟行情需增量生成tick
  if(need > G.tickOHLC.length) genTicks(need - G.tickOHLC.length);
  updateUI(); draw();
}

function startTrade(){
  if(G.started || G.loading) return;   // 行情加载中禁止开始
  G.started = true;
  G.curBar = 0;
  G.phase = 'open';
  G.view.back = 0;                     // 开局回到跟随最新
  G.tradeStartTick = G.tradeDay0 * CFG.dayTicks - 1;        // 交易起点竖线（历史末根）
  G.curTickIdx = G.tradeDay0 * CFG.dayTicks;               // 第0交易日开盘tick
  // 模拟行情按需增量生成tick（真实行情已一次性生成）
  const need = G.curTickIdx + 1;
  if(need > G.tickOHLC.length) genTicks(need - G.tickOHLC.length);
  document.getElementById('startMask').classList.remove('show');
  document.getElementById('startFloat').classList.remove('show');
  document.getElementById('endFloat').classList.remove('show');
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('longBtn').disabled = false;
  document.getElementById('shortBtn').disabled = false;
  updateUI(); draw();
}

/* ===================== 交易引擎 ===================== */
function floatPnl(price){
  if(G.pos===0) return 0;
  return (price - G.entry) * G.pos; // pos正多负空
}
function totalAsset(price){
  return G.cash + G.marginUsed + floatPnl(price); // cash已扣保证金，故加回
}
function marginRatio(price){
  if(G.pos===0 || G.marginUsed===0) return Infinity;
  return totalAsset(price) / G.marginUsed;
}

/* 通用小提示弹窗 */
function showTip(msg){

/* ===================== 交易弹窗（自定义手数，1手=100股） ===================== */
let tradeDir = 'B';
let tradeMaxLots = 0;
let tradePrice = 0;

function doBuy(){
  if(!G.started || G.over) return;
  openTrade('B');
}
function doSell(){
  if(!G.started || G.over) return;
  openTrade('S');
}

function openTrade(dir){
  tradeDir = dir;
  const isBuy = dir === 'B';
  tradePrice = curPrice() * (isBuy ? (1 + CFG.slipRate) : (1 - CFG.slipRate));
  const mask = document.getElementById('tradeMask');
  document.getElementById('tradeTitle').textContent = isBuy ? '买入' : '卖出';
  document.getElementById('tradeTitle').style.color = isBuy ? 'var(--accent)' : 'var(--down)';
  document.getElementById('tradeOk').textContent = isBuy ? '确认买入' : '确认卖出';
  document.getElementById('tradeOk').className = 'btn ' + (isBuy ? 'long' : 'short');
  document.getElementById('tradePrice').textContent = tradePrice.toFixed(2);

  if(isBuy){
    // 最大可买股数：保证金 m=qty*price/lev，手续费=qty*price*feeRate，需 cash >= m+fee
    const maxShares = G.cash * G.lev / (tradePrice * (1 + G.lev * CFG.feeRate));
    tradeMaxLots = Math.floor(maxShares / 100);
    document.getElementById('tradeAvailLabel').textContent = '可用资金';
    document.getElementById('tradeAvail').textContent = fmt(G.cash) + '（杠杆 ' + G.lev + 'x）';
    document.getElementById('tradeMaxLabel').textContent = '最多可买';
    if(tradeMaxLots < 1){
      showTip('可用资金不足买入 1 手（100 股，约 ' + fmt(tradePrice*100) + ' 元）。');
      return;
    }
  }else{
    if(G.pos <= 0){ showTip('当前没有持仓，无法卖出。请先买入建仓。'); return; }
    const sellable = sellableQty();
    if(sellable < 100){
      showTip('T+1 规则：当日买入的股票当日不能卖出。\n下一交易日开盘点起可卖 ' + fmtQty(G.pos) + ' 股。');
      return;
    }
    tradeMaxLots = Math.floor(sellable / 100);
    document.getElementById('tradeAvailLabel').textContent = '可卖股数（T+1）';
    document.getElementById('tradeAvail').textContent = fmtQty(sellable) + ' 股';
    document.getElementById('tradeMaxLabel').textContent = '最多可卖';
  }
  document.getElementById('tradeMax').textContent = tradeMaxLots + ' 手 = ' + fmtQty(tradeMaxLots*100) + ' 股';
  const input = document.getElementById('lotInput');
  input.value = Math.max(1, Math.floor(tradeMaxLots * G.posFrac));
  mask.classList.add('show');
  setTimeout(()=>{ input.focus(); input.select(); }, 30);
}
function setTradeLots(frac){
  G.posFrac = frac;
  const v = Math.max(1, Math.floor(tradeMaxLots * frac));
  document.getElementById('lotInput').value = Math.min(v, tradeMaxLots);
}
function closeTrade(){
  document.getElementById('tradeMask').classList.remove('show');
}
function confirmTrade(){
  const lots = parseInt(document.getElementById('lotInput').value, 10);
  if(!lots || lots < 1){ showTip('请输入有效手数（1 手 = 100 股）。'); return; }
  if(lots > tradeMaxLots){ showTip('手数超出上限（最多 ' + tradeMaxLots + ' 手）。'); return; }
  const qty = lots * 100;
  if(tradeDir === 'B'){
    if(!openPositionQty(qty, tradePrice)){ showTip('可用资金不足。'); return; }
  }else{
    if(qty > sellableQty()){ showTip('T+1：可卖数量不足。'); return; }
    sellPosition(qty, tradePrice);
  }
  checkLiquidation();
  closeTrade();
  updateUI(); draw();
}

function openPositionQty(qty, price){
  // 按精确股数买入开仓：保证金 = qty*price/lev；手续费另扣
  const m = qty * price / G.lev;
  const fee = qty * price * CFG.feeRate;
  if(G.cash < m + fee) return false;
  G.lots.push({qty: qty, price: price, bar: G.curBar, margin: m});
  const oldQty = G.pos;
  G.entry = (G.entry * oldQty + price * qty) / (oldQty + qty);   // 加权开仓价
  G.pos += qty;
  G.cash -= (m + fee);
  G.marginUsed += m;
  G.tradeCount++;
  G.trades.push({dir:'B', tick:G.curTickIdx, price:price, qty:qty, pnl:0});
  return true;
}

function sellPosition(qty, price){
  // 卖出 qty 股：FIFO 扣减 bar<curBar 的批次，释放对应保证金、实现盈亏
  if(G.pos <= 0 || qty <= 0) return;
  if(qty >= G.pos) qty = G.pos;
  let remain = qty, totalPnl = 0, totalMRel = 0;
  for(const lot of G.lots){
    if(remain <= 1e-9) break;
    if(lot.bar >= G.curBar || lot.qty <= 1e-9) continue;   // T+1：当日批次不可卖
    const take = Math.min(lot.qty, remain);
    const takeFrac = take / lot.qty;
    totalPnl += (price - lot.price) * take;
    totalMRel += lot.margin * takeFrac;
    lot.qty -= take;
    lot.margin -= lot.margin * takeFrac;
    remain -= take;
  }
  const fee = qty * price * CFG.feeRate;
  G.cash += totalMRel + totalPnl - fee;
  G.marginUsed -= totalMRel;
  G.realized += totalPnl - fee;
  G.pos -= qty;
  G.tradeCount++;
  G.trades.push({dir:'S', tick:G.curTickIdx, price:price, qty:qty, pnl:totalPnl-fee});
  G.lots = G.lots.filter(l => l.qty > 1e-9);
  if(G.pos < 1e-9){
    G.pos = 0; G.entry = 0; G.marginUsed = 0; G.lots = [];
  }else{
    // 重算剩余持仓加权开仓价
    let wq = 0, wp = 0;
    for(const l of G.lots){ wq += l.qty; wp += l.qty * l.price; }
    G.entry = wq > 0 ? wp / wq : 0;
  }
}

function checkLiquidation(){
  if(G.pos===0) return;
  const p = curPrice();
  const mr = marginRatio(p);
  if(mr <= CFG.liqRatio){
    // 爆仓：强平，返还剩余净值（≥0）
    const remain = Math.max(0, totalAsset(p));
    G.realized += (remain - G.cash - G.marginUsed);
    G.cash = remain;
    G.marginUsed = 0;
    G.pos = 0;
    G.entry = 0;
    G.lots = [];
    settle('保证金不足，爆仓强平！');
  }
}

/* ===================== 结算 ===================== */
function settle(reason){
  G.over = true;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('longBtn').disabled = true;
  document.getElementById('shortBtn').disabled = true;
  hideTip();
  // 强平未平仓位（结算不受T+1限制，按最后收盘价全平）
  if(G.pos!==0){
    const p = curPrice();
    const pnl = floatPnl(p);
    G.realized += pnl;
    G.cash = Math.max(0, G.cash + G.marginUsed + pnl);
    G.marginUsed = 0; G.pos = 0; G.entry = 0; G.lots = [];
  }
  const total = G.cash;
  const ret = (total - G.initCash) / G.initCash * 100;
  const mask = document.getElementById('mask');
  document.getElementById('dlgTitle').textContent = reason;
  const retEl = document.getElementById('dlgRet');
  retEl.textContent = (ret>=0?'+':'') + ret.toFixed(2) + '%';
  retEl.className = 'big ' + (ret>=0?'up':'down');
  document.getElementById('dlgSub').textContent = '总资产: ' + fmt(total);
  document.getElementById('dlgSub2').textContent = '交易次数: ' + G.tradeCount;
  // 真实行情揭晓：股票名 / 区间 / 行情类型 / 与行情对比
  const stEl = document.getElementById('dlgStock');
  const rgEl = document.getElementById('dlgRange');
  const mkEl = document.getElementById('dlgMkt');
  const cpEl = document.getElementById('dlgCmp');
  if(G.real){
    const td = G.real.tradeDays;
    stEl.textContent = '本局股票：' + G.real.name + '（' + G.real.code + '）';
    rgEl.textContent = '区间：' + td[0].date + ' ~ ' + td[td.length-1].date + '（' + td.length + '个交易日）';
    mkEl.innerHTML = '行情类型：<b style="color:#f5c864">' + G.real.marketType + '</b>'
      + ' · 区间行情收益：<b class="' + (G.real.marketRet>=0?'up':'down') + '">'
      + (G.real.marketRet>=0?'+':'') + G.real.marketRet.toFixed(2) + '%</b>（开盘买入持有）';
    const diff = ret - G.real.marketRet;
    cpEl.textContent = (diff>=0 ? '跑赢行情 ' : '跑输行情 ') + Math.abs(diff).toFixed(2) + ' 个百分点';
    cpEl.style.color = diff>=0 ? '#ff9f43' : '#9aa4b8';
  }else{
    stEl.textContent = '本局为模拟行情（随机游走）';
    rgEl.textContent = '--';
    mkEl.textContent = '--';
    cpEl.textContent = '--';
  }
  // 构建快照并保存到历史记录
  const snap = buildSnapshot();
  snap.ret = ret; snap.win = !(reason||'').includes('爆仓'); snap.reason = reason;
  snap.replay = !!G.isReplay;
  G.lastSnap = snap;
  if(!G.isReplay) pushRecent(snap);   // 重玩局不写入历史记录
  if(G.isReplay) document.getElementById('dlgSub2').textContent = '交易次数: ' + G.tradeCount + ' · 重玩局（不计入历史）';
  mask.classList.add('show');
  updateUI();
}

/* 复盘图表：在 #reviewChart 上画全部160根日K + 交易标记 */
function drawReviewChart(){
  const snap = G.review;
  if(!snap) return;
  const cv = document.getElementById('reviewChart');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.fillStyle = '#060708';
  ctx.fillRect(0, 0, W, H);
  if(!snap.daily || !snap.daily.length) return;
  const bars = snap.daily.map((d,i) => ({o:d[0], h:d[1], l:d[2], c:d[3], v:d[4], idx:i}));
  const n = bars.length;
  // 布局
  const padL = 8, padR = 64, padT = 10, padB = 18;
  const volH = 50, gap = 4;
  const chartW = W - padL - padR;
  const mainH = H - padT - padB - volH - gap;
  const bw = chartW / n;
  const barW = Math.max(1.5, bw * 0.7);
  // 价格范围
  let hi = -Infinity, lo = Infinity;
  for(const b of bars){ if(b.h > hi) hi = b.h; if(b.l < lo) lo = b.l; }
  const rng = hi - lo || 1;
  hi += rng * 0.05; lo -= rng * 0.05;
  const yP = p => padT + (hi - p) / (hi - lo) * mainH;
  const xAt = i => padL + i * bw + bw / 2;
  // 成交量范围
  let vmax = 0;
  for(const b of bars){ if(b.v > vmax) vmax = b.v; }
  const yV = v => padT + mainH + gap + volH - (vmax ? v / vmax * volH : 0);
  // 网格线
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.lineWidth = 1;
  for(let i=0; i<=4; i++){
    const y = padT + mainH * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
  }
  // 价格刻度
  ctx.fillStyle = '#6b7280';
  ctx.font = '10px Consolas';
  ctx.textAlign = 'left';
  for(let i=0; i<=4; i++){
    const p = hi - (hi - lo) * i / 4;
    const y = padT + mainH * i / 4;
    ctx.fillText(p.toFixed(2), W - padR + 4, y + 3);
  }
  // 交易起点虚线（历史区与交易区分界）
  const tradeDay0 = (snap.tradeDay0 != null) ? snap.tradeDay0 : (n - CFG.settleDayBars);
  if(tradeDay0 > 0 && tradeDay0 < n){
    const x = xAt(tradeDay0);
    ctx.strokeStyle = 'rgba(255,138,61,.5)';
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + mainH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ff8c42';
    ctx.fillText('交易起点', x + 2, padT + 10);
  }
  // K线
  for(let i=0; i<n; i++){
    const b = bars[i];
    const x = xAt(i);
    const up = b.c >= b.o;
    const col = up ? '#ff7a29' : '#2dd4a0';
    // 影线
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, yP(b.h)); ctx.lineTo(x, yP(b.l)); ctx.stroke();
    // 实体
    const yO = yP(b.o), yC = yP(b.c);
    const top = Math.min(yO, yC), ht = Math.max(1, Math.abs(yC - yO));
    if(up){
      ctx.fillStyle = '#060708';
      ctx.strokeStyle = col;
      ctx.fillRect(x - barW/2, top, barW, ht);
      ctx.strokeRect(x - barW/2, top, barW, ht);
    }else{
      ctx.fillStyle = col;
      ctx.fillRect(x - barW/2, top, barW, ht);
    }
    // 成交量柱
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.3;
    ctx.fillRect(x - barW/2, yV(b.v), barW, padT + mainH + gap + volH - yV(b.v));
    ctx.globalAlpha = 1;
  }
  // 交易标记
  if(snap.trades){
    for(const t of snap.trades){
      const dayIdx = Math.floor(t.tick / CFG.dayTicks);
      if(dayIdx < 0 || dayIdx >= n) continue;
      const x = xAt(dayIdx);
      const b = bars[dayIdx];
      if(t.dir === 'B'){
        // 买入：橙色上三角画在最低价下方
        const y = yP(b.l) + 14;
        ctx.fillStyle = '#ff7a29';
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - 5, y + 9); ctx.lineTo(x + 5, y + 9);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ff8c42';
        ctx.font = '9px Consolas';
        ctx.textAlign = 'center';
        ctx.fillText(t.price.toFixed(2), x, y + 20);
      }else{
        // 卖出：青绿下三角画在最高价上方
        const y = yP(b.h) - 14;
        ctx.fillStyle = '#2dd4a0';
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x - 5, y - 9); ctx.lineTo(x + 5, y - 9);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#45e8bd';
        ctx.font = '9px Consolas';
        ctx.textAlign = 'center';
        ctx.fillText(t.price.toFixed(2), x, y - 12);
      }
    }
  }
}

    showCenterMain();
  }else{
    showCenterLogin();
  }
}
function closeCenter(){
  document.getElementById('centerMask').classList.remove('show');
  refreshAvatar();   // 登录态可能在个人中心内发生变化，同步头像
}
function showCenterLogin(){
  document.getElementById('centerLogin').style.display = '';
  document.getElementById('centerMain').style.display = 'none';
  // 默认显示游客模式
  setLoginTab('guest');
}
function showCenterMain(){
  document.getElementById('centerLogin').style.display = 'none';
  document.getElementById('centerMain').style.display = '';
  const s = loadSettings();
  document.getElementById('curUser').textContent =
    s.mode === 'login' ? s.user : (s.nick || '游客');
  document.getElementById('nickInput').value = s.nick || '';
  // 资金按钮选中态
  const capBtns = document.querySelectorAll('#centerMain .btn.pos[data-cap]');
